<script>
"use strict";
/* ========= Calculs ========= */
const r2=x=>Math.round((+x+Number.EPSILON*Math.sign(x||0))*100)/100;
const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?n:0};
const lineHT=l=>l.kind==='texte'?0:r2(num(l.qty)*num(l.pu));
const allLines=d=>(d.sections||[]).flatMap(s=>s.lines||[]);
function compute(d){
  const lines=allLines(d);
  if(d.imported&&!lines.length){const ht=d.importedHT||0,ttc=d.importedTTC||0;return{gross:ht,discount:0,ht,tva:r2(ttc-ht),ttc,breakdown:[],retention:0,net:ttc,cost:0,margin:null}}
  const g={};let gross=0,cost=0;
  for(const l of lines){if(l.kind==='texte')continue;const c=Math.round(lineHT(l)*100);gross+=c;const k=String(num(l.tva));g[k]=(g[k]||0)+c;cost+=num(l.qty)*num(l.cost)}
  const disc=num(d.discount)/100;
  const breakdown=Object.keys(g).map(Number).sort((a,b)=>b-a).map(rate=>{const base=r2(g[rate]/100*(1-disc));return{rate,base,tva:d.autoliq?0:r2(base*rate/100)}});
  const ht=r2(breakdown.reduce((a,b)=>a+b.base,0)),tva=r2(breakdown.reduce((a,b)=>a+b.tva,0)),ttc=r2(ht+tva);
  const retention=r2(ttc*num(d.retention)/100),net=r2(ttc-retention);
  return{gross:gross/100,discount:r2(gross/100-ht),ht,tva,ttc,retention,net,breakdown,cost:r2(cost),margin:ht>0&&cost>0?(ht-cost)/ht:null};
}
const paidOf=i=>r2((i.payments||[]).reduce((a,p)=>a+num(p.amount),0));
const resteOf=i=>r2(compute(i).net-paidOf(i));

/* ========= Outils ========= */

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const S={clients:[],quotes:[],invoices:[],library:[],settings:null,counters:{},loaded:new Set(),q:'',filter:'tous'};
let db=null,dl=null,Cur=null,CurKind=null,saveT=null,saving=false,readonly=false;

const sb=supabase.createClient("https://ngsokjiivtukcnpkggtz.supabase.co","sb_publishable_sXPzfDbrAxOXNkOn-Rvqcg_r6ApVmkI");

const snapDoc=(id,d)=>({id,exists:d!==undefined,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}});

const mapErr=e=>({code:e.code==='42501'?'invalid_argument':'unavailable',pg:e.code==='P0001'?e.message:null,message:e.message});
async function loadAll(){
  const seen={};
  for(let from=0;;from+=1000){
    const{data,error}=await sb.from('devis_docs').select('collection,id,data').range(from,from+999);
    if(error)throw mapErr(error);
    data.forEach(r=>(seen[r.collection]=seen[r.collection]||new Map()).set(r.id,r.data));
    if(data.length<1000)break;
  }
  for(const c of new Set([...Object.keys(Store),...Object.keys(seen)])){Store[c]=seen[c]||new Map();emit(c)}
}
const makeDb=()=>({
  doc(p){const[c,id]=p.split('/');return{
    async get(){return snapDoc(id,coll(c).get(id))},
    async set(d){const{error}=await sb.from('devis_docs').upsert({collection:c,id,data:d});if(error)throw mapErr(error);coll(c).set(id,d);emit(c)},
    async update(d){await this.set({...coll(c).get(id),...d})},
    async delete(){const{error}=await sb.from('devis_docs').delete().match({collection:c,id});if(error)throw mapErr(error);coll(c).delete(id);emit(c)},

});
function loginView(msg){
  $('#rail').hidden=true;
  $('#view').innerHTML=`<form id="login" class="panel grid" style="max-width:380px;margin:12vh auto 0"><h1 style="color:var(--accent);letter-spacing:.05em">MAGENCIA</h1><p class="muted" style="margin:0">Devis et factures</p>${msg?`<div class="alert bad"><span>${esc(msg)}</span></div>`:''}<label class="f">E-mail<input id="l-mail" type="email" autocomplete="username" required></label><label class="f">Mot de passe<input id="l-pass" type="password" autocomplete="current-password" required></label><button class="btn pri" type="submit">Se connecter</button></form>`;
  $('#login').addEventListener('submit',async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#l-mail').value.trim(),password:$('#l-pass').value});if(error)return loginView('E-mail ou mot de passe incorrect.');start()});
}
async function start(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  const{data:ok}=await sb.rpc('devis_allowed');
  if(!ok){await sb.auth.signOut();return loginView("Ce compte n'a pas accès aux devis et factures.")}
  $('#rail').hidden=false;boot();
}
function toast(m){const t=$('#toast');t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',3800)}
const fail=e=>{console.error(e);toast(e?.pg?e.pg:e?.code==='invalid_argument'?"Enregistrement refusé : ton accès ne permet pas de modifier les données.":"Enregistrement impossible. Vérifie la connexion puis réessaie.")};
const put=(c,id,data)=>db.doc(`${c}/${id}`).set(data);
async function boot(){
  db=makeDb();
  const late=setTimeout(()=>{if(S.loaded.size<6)$('#view').insertAdjacentHTML('afterbegin','<div class="alert"><span>Les données mettent du temps à arriver. Elles s\'afficheront dès que la connexion répond.</span></div>')},10000);
  const done=(k,meta)=>{if(!meta.fromCache)S.loaded.add(k);if(S.loaded.size>=6)clearTimeout(late);refresh()};
  for(const[c,k]of[['clients','clients'],['quotes','quotes'],['invoices','invoices'],['library','library']])
    db.collection(c).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));done(k,s.metadata)},fail);
  db.doc('settings/company').onSnapshot(s=>{S.settings=s.data()||{};done('settings',s.metadata)},fail);
  db.doc('counters/numbers').onSnapshot(s=>{S.counters=s.data()||{};done('counters',s.metadata)},fail);
  addEventListener('hashchange',route);route();
  try{await loadAll()}catch(e){fail(e)}
  sb.channel('devis').on('postgres_changes',{event:'*',schema:'public',table:'devis_docs'},p=>{const r=p.new&&p.new.id?p.new:p.old;if(!r?.collection)return;if(p.eventType==='DELETE')coll(r.collection).delete(r.id);else coll(r.collection).set(r.id,r.data);emit(r.collection)}).subscribe();
  setInterval(()=>{if(!document.hidden)loadAll().catch(()=>{})},60000);
}
function refresh(){if(CurKind==='q'||CurKind==='f'){return}if(document.activeElement&&document.activeElement.matches('#view input,#view textarea,#view select'))return;if(!$('#modal').innerHTML)route()}

async function nextNumber(kind,year){const{data,error}=await sb.rpc('devis_next_number',{p_key:kind+year});if(error)throw mapErr(error);await loadAll();return data}

/* ========= Navigation ========= */
const NAV=[['accueil','Accueil'],['devis','Devis'],['factures','Factures'],['clients','Clients'],['biblio','Bibliothèque'],['reglages','Réglages']];
function renderRail(cur){$('#rail').innerHTML=`<div class="brand">MAGENCIA<small>Devis &amp; factures</small></div>`+NAV.map(([k,l])=>`<a class="nav${k===cur?' on':''}${k==='reglages'?' end':''}" href="#${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}</a>`).join('')}
async function route(){
  await flush();
  const h=location.hash.slice(1)||'accueil';
  Cur=null;CurKind=null;
  if(h!==route.last){if(['devis','factures'].includes(h)&&route.last&&route.last!==h){S.filter='tous';S.q=''}route.last=h}
  if(h.startsWith('q-')){renderRail('devis');return openDoc('q',h.slice(2))}
  if(h.startsWith('f-')){renderRail('factures');return openDoc('f',h.slice(2))}
  if(h.startsWith('c-')){renderRail('clients');return viewClient(h.slice(2))}
  const k=NAV.some(n=>n[0]===h)?h:'accueil';renderRail(k);
  ({accueil:viewHome,devis:viewQuotes,factures:viewInvoices,clients:viewClients,biblio:viewLibrary,reglages:viewSettings})[k]();
}
const invStatus=i=>{if(i.status==='brouillon')return'brouillon';const c=compute(i),r=resteOf(i);if(c.net>0&&r<=0||c.net<=0&&i.status==='payee')return'payee';if(i.dueDate&&i.dueDate<today()&&c.net>0)return'retard';if(paidOf(i)>0)return'partielle';return i.status};
const pill=(s,L)=>`<span class="pill ${s}">${esc(L[s]||s)}</span>`;
const sortDesc=a=>[...a].sort((x,y)=>(y.date||'').localeCompare(x.date||'')||(y.number||'~').localeCompare(x.number||'~'));
const settled=()=>S.settings!==null;
function missingCompany(){const c=S.settings||{};return COMPANY.filter(f=>f[2]&&!String(c[f[0]]||'').trim()).map(f=>f[1])}

/* ========= Accueil ========= */
function viewHome(){
  if(!settled()){$('#view').innerHTML='<p class="muted">Chargement des devis et factures…</p>';return}
  const t=today(),qs=S.quotes,is=S.invoices;
  const toSend=sortDesc(qs.filter(q=>q.status==='finalise'));
  const toChase=sortDesc(qs.filter(q=>q.status==='envoye'&&q.validUntil&&q.validUntil<t));
  const open=is.filter(i=>i.status!=='brouillon'&&resteOf(i)>0);
  const late=open.filter(i=>i.dueDate&&i.dueDate<t);
  const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  const year=t.slice(0,4),signed=qs.filter(q=>q.status==='signe'&&(q.date||'').startsWith(year));
  const missing=missingCompany();
  const days=Math.ceil((new Date('2027-09-01')-new Date(t))/864e5);
  const row=(q,tag)=>`<a class="list-item" href="#q-${q.id}"><div><span class="mono">${esc(q.number||'Brouillon')}</span> ${tag||''}<div>${esc(q.clientName)}</div><div class="muted">${esc(q.siteName||'')}</div></div><div class="num">${eur(compute(q).ht)}<div class="muted">${frD(q.validUntil)}</div></div></a>`;
  const ir=i=>`<a class="list-item" href="#f-${i.id}"><div><span class="mono">${esc(i.number)}</span><div>${esc(i.clientName)}</div></div><div class="num">${eur(resteOf(i))}<div class="muted">échéance ${frD(i.dueDate)}</div></div></a>`;
  $('#view').innerHTML=`
  <div class="head"><h1>Accueil</h1><button class="btn pri" data-a="newQuote">Nouveau devis</button><button class="btn" data-a="newInvoice">Nouvelle facture</button></div>
  ${missing.length?`<div class="alert"><span><b>Émission des factures bloquée.</b> Il manque ${missing.length} information${missing.length>1?'s':''} sur l'entreprise : ${esc(missing.join(', '))}.</span><a class="btn sm" href="#reglages">Compléter</a></div>`:''}
  ${!S.counters.invoiceConfirmed?`<div class="alert"><span><b>Numéro de facture à confirmer.</b> Vérifie le dernier numéro émis sur Obat avant ta première facture ici.</span><a class="btn sm" href="#reglages">Confirmer</a></div>`:''}
  <div class="kpis">
    <a class="kpi warn" href="#devis"><span>Devis à envoyer</span><b>${toSend.length}</b><em>${eur(sum(toSend,q=>compute(q).ht))} HT</em></a>
    <a class="kpi warn" href="#devis"><span>Devis à relancer</span><b>${toChase.length}</b><em>${eur(sum(toChase,q=>compute(q).ht))} HT</em></a>
    <a class="kpi bad" href="#factures"><span>Factures en retard</span><b>${late.length}</b><em>${eur(sum(late,resteOf))} à encaisser</em></a>
    <a class="kpi" href="#factures"><span>Reste à encaisser</span><b>${open.length}</b><em>${eur(sum(open,resteOf))}</em></a>
  </div>
  <div class="two">
    <div class="stack">
      <section class="panel"><h2>À envoyer</h2>${toSend.map(q=>row(q)).join('')||'<p class="muted">Aucun devis en attente d\'envoi.</p>'}</section>
      <section class="panel"><h2>À relancer</h2><p class="muted">Envoyés, validité dépassée, non signés.</p>${toChase.map(q=>row(q)).join('')||'<p class="muted">Aucun devis à relancer.</p>'}</section>
    </div>
    <div class="stack">
      <section class="panel"><h2>Factures en retard</h2>${late.map(ir).join('')||'<p class="muted">Aucune facture de ce logiciel n\'est en retard. Les factures Obat ne sont pas encore reprises.</p>'}</section>
      <section class="panel"><h2>Signé en ${year}</h2><p style="font:600 27px var(--display);margin:4px 0">${eur(sum(signed,q=>compute(q).ht))} HT</p><p class="muted">${signed.length} devis repris ou créés ici.</p></section>
      <section class="panel"><h3>Facture électronique</h3><p>Émission obligatoire le <b>1<sup>er</sup> septembre 2027</b> pour les PME, soit dans <b>${days} jours</b>. Ce logiciel produit des PDF : il devra être relié à une plateforme agréée avant cette date.</p></section>
    </div>
  </div>`;
}

/* ========= Listes ========= */
function filterBar(id,opts,ph){return`<div class="tool"><input type="search" id="${id}" placeholder="${ph}" value="${esc(S.q)}" aria-label="${ph}">${opts.map(([k,l])=>`<button class="chip${S.filter===k?' on':''}" data-a="filter" data-k="${k}">${l}</button>`).join('')}</div>`}
function matches(d){const q=S.q.trim().toLowerCase();return!q||[d.number,d.clientName,d.siteName,d.subject].some(v=>String(v||'').toLowerCase().includes(q))}
function viewQuotes(){
  $('#view').innerHTML=`<div class="head"><h1>Devis</h1><button class="btn pri" data-a="newQuote">Nouveau devis</button></div>
  ${filterBar('search',[['tous','Tous'],...Object.entries(QS)],'Rechercher un n°, client, chantier')}
  <div class="panel card-list"><div id="rows"></div></div>`;
  drawQuotes();
}
function drawQuotes(){
  const a=sortDesc(S.quotes).filter(q=>(S.filter==='tous'||q.status===S.filter)&&matches(q));
  $('#rows').innerHTML=a.length?`<div class="tw"><table class="t resp"><thead><tr><th>N°</th><th>Client / chantier</th><th>Statut</th><th>Date</th><th>Validité</th><th class="num">Total HT</th><th class="num">Total TTC</th></tr></thead><tbody>${a.map(q=>{const c=compute(q);return`<tr data-go="#q-${q.id}"><td data-l="N°" class="mono">${esc(q.number||'—')}</td><td data-l="Client"><div><div>${esc(q.clientName||'Sans client')}</div><div class="muted">${esc(q.siteName||'')}</div></div></td><td data-l="Statut">${pill(q.status,QS)}</td><td data-l="Date">${frD(q.date)}</td><td data-l="Validité">${frD(q.validUntil)}</td><td data-l="Total HT" class="num">${eur(c.ht)}</td><td data-l="Total TTC" class="num">${eur(c.ttc)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">Aucun devis ne correspond. Crée le premier avec « Nouveau devis ».</div>`;
}
function viewInvoices(){
  $('#view').innerHTML=`<div class="head"><h1>Factures</h1><button class="btn" data-a="exportCsv">Exporter pour la compta</button><button class="btn pri" data-a="newInvoice">Nouvelle facture</button></div>
  ${filterBar('search',[['tous','Toutes'],['brouillon','Brouillons'],['retard','En retard'],['envoyee','Envoyées'],['payee','Payées']],'Rechercher un n°, client, chantier')}
  <div class="panel card-list"><div id="rows"></div></div>`;
  drawInvoices();
}
function drawInvoices(){
  const a=sortDesc(S.invoices).filter(i=>(S.filter==='tous'||invStatus(i)===S.filter)&&matches(i));
  $('#rows').innerHTML=a.length?`<div class="tw"><table class="t resp"><thead><tr><th>N°</th><th>Type</th><th>Client / chantier</th><th>Statut</th><th>Date</th><th>Échéance</th><th class="num">Total HT</th><th class="num">Net à payer</th><th class="num">Reste</th></tr></thead><tbody>${a.map(i=>{const c=compute(i);return`<tr data-go="#f-${i.id}"><td data-l="N°" class="mono">${esc(i.number||'—')}</td><td data-l="Type">${esc(FT[i.type]||'')}${i.seq?' #'+i.seq:''}</td><td data-l="Client"><div><div>${esc(i.clientName||'Sans client')}</div><div class="muted">${esc(i.siteName||'')}</div></div></td><td data-l="Statut">${pill(invStatus(i),FS)}</td><td data-l="Date">${frD(i.date)}</td><td data-l="Échéance">${frD(i.dueDate)}</td><td data-l="Total HT" class="num">${eur(c.ht)}</td><td data-l="Net à payer" class="num">${eur(c.net)}</td><td data-l="Reste" class="num">${i.status==='brouillon'?'—':eur(resteOf(i))}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">Aucune facture ici. Crée-la depuis un devis signé ou avec « Nouvelle facture ».</div>`;
}

/* ========= Éditeur devis / facture ========= */
const blankLine=(tva=20)=>({id:uid(),kind:'ouvrage',ref:'',label:'',qty:1,unit:'u',pu:0,cost:0,tva});
const blankSection=(tva,title='')=>({id:uid(),title,lines:[blankLine(tva)]});
const baseDoc=()=>({clientId:'',clientName:'',siteId:'',siteName:'',siteAddress:'',subject:'',date:today(),tvaDefault:20,discount:0,retention:0,autoliq:false,sections:[blankSection(20,'Travaux')],notes:'',createdAt:new Date().toISOString()});
async function newQuote(){const days=num(S.settings?.quoteDays)||30,d={...baseDoc(),status:'brouillon',number:null,validUntil:addDays(today(),days)},id=uid();await put('quotes',id,d).catch(fail);location.hash='q-'+id}
async function newInvoice(){const days=num(S.settings?.payDays)||15,d={...baseDoc(),type:'simple',status:'brouillon',number:null,dueDate:addDays(today(),days),payments:[]},id=uid();await put('invoices',id,d).catch(fail);location.hash='f-'+id}
async function openDoc(kind,id){
  const list=kind==='q'?S.quotes:S.invoices;let d=list.find(x=>x.id===id);
  if(!d){const s=await db.doc(`${kind==='q'?'quotes':'invoices'}/${id}`).get();if(!s.exists){$('#view').innerHTML='<div class="empty">Ce document n\'existe plus.</div>';return}d={id,...s.data()}}
  Cur=clone(d);CurKind=kind;drawDoc();
}
function drawDoc(){
  const d=Cur,q=CurKind==='q',cl=S.clients.find(c=>c.id===d.clientId);
  readonly=q?d.status!=='brouillon':d.status!=='brouillon';
  const dis=readonly?' disabled':'';
  const sites=cl?.sites||[];
  const st=q?pill(d.status,QS):pill(invStatus(d),FS);
  const title=q?(d.number||'Devis brouillon'):(d.number||'Facture brouillon');
  let acts='';
  if(q){
    if(d.status==='brouillon')acts=`<button class="btn pri" data-a="finalize">Finaliser</button><button class="btn dan" data-a="delDoc">Supprimer</button>`.replace(d.number?'<button class="btn dan" data-a="delDoc">Supprimer</button>':'~','');
    if(d.status==='finalise')acts=`<button class="btn pri" data-a="qStatus" data-s="envoye">Marquer envoyé</button><button class="btn" data-a="qStatus" data-s="brouillon">Modifier</button>`;
    if(d.status==='envoye')acts=`<button class="btn pri" data-a="qStatus" data-s="signe">Marquer signé</button><button class="btn" data-a="qStatus" data-s="refuse">Refusé</button><button class="btn" data-a="qStatus" data-s="brouillon">Modifier</button>`;
    if(d.status==='signe')acts=`<button class="btn pri" data-a="billMenu">Facturer</button>`;
    if(d.status==='refuse')acts=`<button class="btn" data-a="qStatus" data-s="envoye">Rouvrir</button>`;
    acts+=`<button class="btn" data-a="dupQuote">Dupliquer</button>`;
  }else{
    if(d.status==='brouillon')acts=`<button class="btn pri" data-a="issue">Émettre</button><button class="btn dan" data-a="delDoc">Supprimer</button>`;
    else{
      if(d.status==='emise')acts=`<button class="btn" data-a="markSent">Marquer envoyée</button>`;
      if(resteOf(d)>0)acts=`<button class="btn pri" data-a="payment">Ajouter un règlement</button>`+acts;
      if(d.type!=='avoir')acts+=`<button class="btn" data-a="avoir">Créer un avoir</button>`;
    }
  }
  $('#view').innerHTML=`
  <div class="head"><h1 class="mono" style="font-size:22px">${esc(title)}</h1>${q?'':`<span class="pill">${esc(FT[d.type]||'')}${d.seq?' #'+d.seq:''}</span>`}${st}<span class="save" id="saved"></span></div>
  <div class="tool"><a class="btn ghost" href="#${q?'devis':'factures'}">← Retour</a><span style="flex:1"></span>${acts}<button class="btn" data-a="pdf">PDF</button></div>
  ${d.imported&&!allLines(d).length?`<div class="alert info"><span>Repris d'Obat sans les lignes. Importe l'Excel du devis pour pouvoir le facturer ici.</span>${readonly?'<button class="btn sm" data-a="qStatus" data-s="brouillon">Modifier</button>':''}</div>`:''}
  ${!q&&d.status!=='brouillon'?`<div class="alert info"><span>Facture émise : verrouillée. Pour corriger, crée un avoir.</span></div>`:''}
  <div class="stack">
  <section class="panel grid">
    <div class="grid g2">
      <label class="f">Client<select id="f-client" data-d="clientId"${dis}>${opt('','Choisir un client…',d.clientId)}${[...S.clients].sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(c=>opt(c.id,c.name,d.clientId)).join('')}${readonly?'':opt('__new','+ Nouveau client','')}</select></label>
      <label class="f">Chantier<select id="f-site" data-d="siteId"${dis}>${opt('',sites.length||d.siteName?'Choisir un chantier…':'Aucun chantier',d.siteId)}${d.siteName&&!sites.some(s=>s.id===d.siteId)?opt(d.siteId||'',d.siteName,d.siteId):''}${sites.map(s=>opt(s.id,s.name,d.siteId)).join('')}${readonly||!cl?'':opt('__new','+ Nouveau chantier','')}</select></label>
    </div>
    <label class="f">Objet<input id="f-subject" data-d="subject" value="${esc(d.subject)}" ${readonly?'':'placeholder="Ex. Aménagement de la surface de vente"'}${dis}></label>
    <div class="grid g4">
      <label class="f">Date<input id="f-date" type="date" data-d="date" value="${esc(d.date)}"${dis}></label>
      <label class="f">${q?'Valable jusqu\'au':'Échéance'}<input id="f-due" type="date" data-d="${q?'validUntil':'dueDate'}" value="${esc(q?d.validUntil:d.dueDate)}"${dis}></label>
      <label class="f">Remise globale (%)<input id="f-disc" inputmode="decimal" data-d="discount" value="${esc(d.discount||'')}"${dis}></label>
      <label class="f">Retenue de garantie (%)<input id="f-ret" inputmode="decimal" data-d="retention" value="${esc(d.retention||'')}"${dis}></label>
    </div>
    <label class="c"><input id="f-auto" type="checkbox" data-d="autoliq"${d.autoliq?' checked':''}${dis}> Autoliquidation de la TVA (sous-traitance : facturé HT au donneur d'ordre)</label>
  </section>
  <div class="stack" id="secs">${sectionsHTML()}</div>
  ${readonly?'':`<div class="tool"><button class="btn" data-a="addSec">Ajouter une section</button><button class="btn" data-a="importXls">Importer un Excel Obat</button><input type="file" id="xls" accept=".xlsx,.xls,.xltx,.csv" hidden></div>`}
  <section class="panel two">
    <label class="f">Notes sur le document<textarea id="f-notes" data-d="notes"${dis}>${esc(d.notes)}</textarea></label>
    <div class="totals" id="tot">${totalsHTML()}</div>
  </section>
  ${!q&&d.status!=='brouillon'?paymentsHTML():''}
  </div>`;
}
const numOf=(si,li)=>{const ls=Cur.sections[si].lines;let n=0;for(let i=0;i<=li;i++)if(ls[i].kind!=='texte')n++;return`${si+1}.${n}`};
function sectionsHTML(){
  const dis=readonly?' disabled':'';
  return Cur.sections.map((s,si)=>{
    const sum=r2(s.lines.reduce((a,l)=>a+lineHT(l),0));
    return`<section class="sec" data-si="${si}">
    <div class="sec-h"><span class="n">${si+1}</span><input id="s-${s.id}" data-s="title" value="${esc(s.title)}" placeholder="Titre de la section" aria-label="Titre de la section ${si+1}"${dis}>
      <span class="num sec-t" data-sum="${si}">${eur(sum)}</span>${readonly?'':`<button class="ic" data-a="secUp" title="Monter la section" aria-label="Monter la section">↑</button><button class="ic del" data-a="secDel" title="Supprimer la section" aria-label="Supprimer la section">×</button>`}</div>
    <div class="ln hd"><span>N°</span><span>Désignation</span><span class="r">Qté</span><span>Unité</span><span class="r">PU HT</span><span class="r">Déb. sec</span><span>TVA</span><span class="r">Total HT</span><span></span></div>
    ${s.lines.map((l,li)=>l.kind==='texte'?`<div class="ln txt" data-li="${li}"><span class="no">—</span><textarea class="lab" id="l-${l.id}-label" data-l="label" aria-label="Texte"${dis}>${esc(l.label)}</textarea>${lineActs()}</div>`:`<div class="ln" data-li="${li}">
      <span class="no">${numOf(si,li)}</span>
      <textarea class="lab" id="l-${l.id}-label" data-l="label" aria-label="Désignation" placeholder="Désignation"${dis}>${esc(l.label)}</textarea>
      <input class="qty n" id="l-${l.id}-qty" data-l="qty" inputmode="decimal" aria-label="Quantité" value="${fv(l.qty)}"${dis}>
      <select class="uni" id="l-${l.id}-unit" data-l="unit" aria-label="Unité"${dis}>${[...new Set([...UNITS,l.unit])].map(u=>opt(u,u,l.unit)).join('')}</select>
      <input class="pu n" id="l-${l.id}-pu" data-l="pu" inputmode="decimal" aria-label="Prix unitaire HT" value="${fv(l.pu)}"${dis}>
      <input class="cst n" id="l-${l.id}-cost" data-l="cost" inputmode="decimal" aria-label="Déboursé sec" value="${l.cost?fv(l.cost):''}"${dis}>

const normH=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
function parseObat(rows,tva=20){
  const hi=rows.findIndex(r=>r.some(c=>normH(c)==='designation'));
  if(hi<0)throw new Error('Colonne « Désignation » introuvable.');
  const H={};rows[hi].forEach((c,i)=>H[normH(c)]=i);
  const g=(r,...k)=>{for(const x of k)if(H[x]!==undefined&&r[H[x]]!==undefined&&r[H[x]]!=='')return r[H[x]];return''};
  const secs=[];let cur=null;
  const ensure=()=>{if(!cur){cur={id:uid(),title:'Travaux',lines:[]};secs.push(cur)}return cur};
  for(const r of rows.slice(hi+1)){
    const lab=String(g(r,'designation')).trim(),type=normH(g(r,'type'));
    if(!lab&&!num(g(r,'quantite')))continue;
    if(type==='section'){cur={id:uid(),title:lab,lines:[]};secs.push(cur);continue}
    if(type==='soussection'||type==='texte'){ensure().lines.push({id:uid(),kind:'texte',label:lab});continue}
    let rate=num(g(r,'tva'));if(g(r,'tva')==='')rate=tva;else if(rate>0&&rate<1)rate=r2(rate*100);
    let pu=num(g(r,'prixuht','prixunitaireht','puht')),rem=num(g(r,'remise'));if(rem>0&&rem<1)rem*=100;if(rem)pu=r2(pu*(1-rem/100));
    const kind={fourniture:'fourniture',maindoeuvre:'mo',ouvrage:'ouvrage',soustraitance:'st',materiel:'materiel',divers:'divers'}[type]||'ouvrage';
    ensure().lines.push({id:uid(),kind,ref:String(g(r,'reference')),label:lab,qty:num(g(r,'quantite'))||0,unit:String(g(r,'unite')||'u'),pu,cost:num(g(r,'debourssec','deboursesec')),tva:rate});
  }
  return secs;
}
async function readSheet(file){if(!window.XLSX)throw new Error('Lecteur Excel non chargé.');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true})}
async function importInto(file){
  try{const secs=parseObat(await readSheet(file),Cur.tvaDefault);const n=secs.reduce((a,s)=>a+s.lines.length,0);if(!n)return toast('Aucune ligne trouvée dans ce fichier.');
    const empty=Cur.sections.length===1&&Cur.sections[0].lines.every(l=>!l.label);Cur.sections=empty?secs:[...Cur.sections,...secs];redrawSecs();toast(`${n} lignes importées.`)}
  catch(e){toast(e.message||'Fichier illisible.')}
}

function checkIssue(d){
  const e=[],cl=S.clients.find(c=>c.id===d.clientId),miss=missingCompany();
  if(miss.length)e.push(`Réglages : ${miss.join(', ')}.`);
  if(!S.counters.invoiceConfirmed)e.push('Réglages : confirme le dernier numéro de facture Obat.');
  if(!cl)e.push('Choisis un client.');
  else{if(!String(cl.address||'').trim())e.push(`Adresse du client ${cl.name} manquante.`);
    if(cl.type!=='part'&&!String(cl.siren||'').trim())e.push(`SIREN du client ${cl.name} manquant.`);
    if(d.autoliq&&!String(cl.tvaNum||'').trim())e.push(`N° de TVA de ${cl.name} manquant (obligatoire en autoliquidation).`);
    if(d.autoliq&&cl.type==='part')e.push("Pas d'autoliquidation pour un particulier.")}
  if(!d.siteAddress&&!d.siteName)e.push('Indique le chantier (lieu d\'exécution).');
  if(!allLines(d).some(l=>l.kind!=='texte'))e.push('Ajoute au moins une ligne chiffrée.');
  if(!d.dueDate)e.push("Indique l'échéance.");
  const last=S.invoices.filter(i=>i.status!=='brouillon').map(i=>i.date).sort().pop();
  if(last&&d.date<last)e.push(`Date antérieure à la dernière facture émise (${frD(last)}).`);
  return e;
}

  await flush();const e=checkIssue(Cur);

const asc=s=>String(s??'').replace(/[  ]/g,' ').replace(/œ/g,'oe').replace(/Œ/g,'OE').replace(/[≤≥]/g,'').replace(/→/g,'-');
function buildPdf(d,kind){
  const{jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'}),co=d.company||S.settings||{},cl=d.client||S.clients.find(c=>c.id===d.clientId)||{name:d.clientName};
  const W=210,M=14,c=compute(d),BLUE=[20,80,200],INK=[20,28,43],MUT=[91,102,121];
  const q=kind==='q',title=q?'DEVIS':d.type==='avoir'?'AVOIR':d.type==='acompte'?"FACTURE D'ACOMPTE":d.type==='situation'?`SITUATION N° ${d.seq}`:'FACTURE';
  pdf.setTextColor(...BLUE);pdf.setFont('helvetica','bold');pdf.setFontSize(18);pdf.text(asc(co.name||'MAGENCIA'),M,18);
  pdf.setTextColor(...MUT);pdf.setFont('helvetica','normal');pdf.setFontSize(9);
  const cLines=[co.capital?`${co.form||''} au capital de ${co.capital}`.trim():co.form,...String(co.address||'').split('\n'),[co.phone,co.email].filter(Boolean).join(' · ')].filter(Boolean).map(asc);
  pdf.text(cLines,M,24);
  pdf.setTextColor(...INK);pdf.setFont('helvetica','bold');pdf.setFontSize(15);pdf.text(asc(title),W-M,18,{align:'right'});
  pdf.setFontSize(10);pdf.setFont('helvetica','normal');
  const meta=[d.number||'Brouillon',`Date : ${frD(d.date)}`,q?`Valable jusqu'au : ${frD(d.validUntil)}`:`Échéance : ${frD(d.dueDate)}`];if(d.quoteNumber)meta.push(`Devis : ${d.quoteNumber}`);if(d.refInvoice)meta.push(`Facture d'origine : ${d.refInvoice}`);
  pdf.text(meta.map(asc),W-M,24,{align:'right'});
  const y0=48;pdf.setDrawColor(211,218,229);pdf.rect(108,y0,88,28);
  pdf.setFontSize(8);pdf.setTextColor(...MUT);pdf.text('CLIENT',111,y0+4.5);
  pdf.setFontSize(10);pdf.setTextColor(...INK);pdf.setFont('helvetica','bold');pdf.text(asc(pdf.splitTextToSize(cl.name||'',82)[0]||''),111,y0+9.5);pdf.setFont('helvetica','normal');pdf.setFontSize(9);
  const ca=[...String(cl.address||'').split('\n'),cl.siren?`SIREN ${cl.siren}`:'',cl.tvaNum?`TVA ${cl.tvaNum}`:''].filter(Boolean).map(asc).slice(0,4);pdf.text(ca,111,y0+14);
  pdf.setFontSize(8);pdf.setTextColor(...MUT);pdf.text('CHANTIER',M,y0+4.5);pdf.setFontSize(10);pdf.setTextColor(...INK);pdf.setFont('helvetica','bold');pdf.text(pdf.splitTextToSize(asc(d.siteName||'—'),88)[0],M,y0+9.5);pdf.setFont('helvetica','normal');pdf.setFontSize(9);
  const sa=[...String(d.siteAddress||'').split('\n'),d.subject?`Objet : ${d.subject}`:''].filter(Boolean).map(asc);pdf.text(pdf.splitTextToSize(sa.join('\n'),90).slice(0,4),M,y0+14);
  const body=[];
  (d.sections||[]).forEach((s,si)=>{
    body.push([{content:`${si+1}   ${asc(s.title)}`,colSpan:4,styles:{fontStyle:'bold',fillColor:[237,240,245]}},{content:asc(eur(r2((s.lines||[]).reduce((a,l)=>a+lineHT(l),0)))),colSpan:2,styles:{fontStyle:'bold',halign:'right',fillColor:[237,240,245]}}]);
    let n=0;for(const l of s.lines||[]){if(l.kind==='texte'){body.push([{content:'',},{content:asc(l.label),colSpan:5,styles:{fontStyle:'italic',textColor:MUT}}]);continue}n++;
      body.push([`${si+1}.${n}`,asc(l.label),String(num(l.qty)).replace('.',','),asc(l.unit),asc(eur(num(l.pu))),asc(eur(lineHT(l)))])}
  });
  pdf.autoTable({startY:y0+33,margin:{left:M,right:M,bottom:22},head:[['N°','Désignation','Qté','Unité','PU HT','Total HT']],body,theme:'plain',
    styles:{font:'helvetica',fontSize:9,cellPadding:{top:1.6,bottom:1.6,left:1.5,right:1.5},textColor:INK,lineColor:[211,218,229],lineWidth:{bottom:.1}},
    headStyles:{fillColor:BLUE,textColor:255,fontStyle:'bold'},
    columnStyles:{0:{cellWidth:13},2:{cellWidth:15,halign:'right'},3:{cellWidth:13},4:{cellWidth:25,halign:'right'},5:{cellWidth:27,halign:'right'}}});
  let y=pdf.lastAutoTable.finalY+6;
  const need=60;if(y+need>270){pdf.addPage();y=20}
  const rows=[];
  if(c.discount)rows.push(['Sous-total HT',eur(c.gross)],['Remise','- '+eur(c.discount)]);
  rows.push(['Total HT',eur(c.ht)]);
  if(d.autoliq)rows.push(['TVA','Autoliquidation']);else c.breakdown.filter(b=>b.rate>0).forEach(b=>rows.push([`TVA ${String(b.rate).replace('.',',')} % sur ${eur(b.base)}`,eur(b.tva)]));
  rows.push(['Total TTC',eur(c.ttc)]);if(c.retention)rows.push([`Retenue de garantie ${d.retention} %`,'- '+eur(c.retention)]);
  pdf.setFontSize(9.5);let ty=y;for(const[a,b]of rows){pdf.setTextColor(...MUT);pdf.text(asc(a),122,ty);pdf.setTextColor(...INK);pdf.text(asc(b),W-M,ty,{align:'right'});ty+=5}
  pdf.setFillColor(...BLUE);pdf.rect(120,ty-3.6,W-M-120,8,'F');pdf.setTextColor(255);pdf.setFont('helvetica','bold');pdf.setFontSize(11);pdf.text(q&&!c.retention?'TOTAL':'NET À PAYER',122,ty+1.8);pdf.text(asc(eur(c.net)),W-M-2,ty+1.8,{align:'right'});ty+=12;
  pdf.setFont('helvetica','normal');pdf.setTextColor(...MUT);pdf.setFontSize(8);
  const leg=[];
  if(d.autoliq)leg.push('Autoliquidation : TVA due par le preneur, art. 283-2 nonies du CGI.');
  if(!q){leg.push(`Nature de l'opération : prestations de services. ${co.tvaDebits?'Option pour le paiement de la TVA d\'après les débits.':''}`);if(d.type==='acompte')leg.push('Acompte à déduire de la facture finale.');if(co.iban)leg.push(`Règlement par virement : IBAN ${co.iban}${co.bic?' · BIC '+co.bic:''}`);if(cl.type!=='part'&&co.penalties)leg.push(co.penalties)}
  if(co.assureur)leg.push(`Assurance décennale : ${co.assureur}, police ${co.police||''}, couverture ${co.couverture||''}.`);
  if(d.notes)leg.push(d.notes);
  const lt=pdf.splitTextToSize(leg.map(asc).join('\n'),q?100:100);pdf.text(lt,M,y);
  if(q){const yy=Math.max(ty,y+lt.length*3.4+3);pdf.setTextColor(...INK);pdf.setFontSize(9);pdf.rect(120,yy,W-M-120,24);pdf.text('Bon pour accord, date et signature',122,yy+5)}
  const pages=pdf.getNumberOfPages();for(let i=1;i<=pages;i++){pdf.setPage(i);pdf.setFontSize(7.5);pdf.setTextColor(...MUT);pdf.text(asc(`${co.name||''} ${co.form||''} · SIRET ${co.siret||''} · RCS ${co.rcs||''} · TVA ${co.tva||''}`),M,288);pdf.text(`${i} / ${pages}`,W-M,288,{align:'right'})}
  return pdf;
}
async function saveFile(name,data){const b=data instanceof Blob?data:new Blob([data],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=name;document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast(`${name} prêt.`)}
async function makePdf(){if(!window.jspdf)return toast('Générateur PDF non chargé. Recharge la page.');await flush();const d=Cur;await saveFile(`${d.number||'Brouillon'} ${d.clientName||''}.pdf`.trim(),buildPdf(d,CurKind).output('blob'))}
async function exportCsv(){
  const a=S.invoices.filter(i=>i.status!=='brouillon').sort((x,y)=>(x.number||'').localeCompare(y.number||''));
  if(!a.length)return toast('Aucune facture émise à exporter.');
  const f=n=>String(r2(n)).replace('.',','),q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const rows=[['Numéro','Date','Type','Client','Chantier','Total HT','TVA','Total TTC','Retenue','Net à payer','Encaissé','Reste','Statut'].join(';'),...a.map(i=>{const c=compute(i);return[q(i.number),i.date,q(FT[i.type]),q(i.clientName),q(i.siteName),f(c.ht),f(c.tva),f(c.ttc),f(c.retention),f(c.net),f(paidOf(i)),f(resteOf(i)),q(FS[invStatus(i)])].join(';')})];

}

async function saveSettings(){const d={...(S.settings||{})};$$('[data-co]').forEach(i=>d[i.dataset.co]=i.type==='checkbox'?i.checked:i.value.trim());await put('settings','company',d);toast('Entreprise enregistrée.')}
async function saveCounters(){const y=today().slice(0,4);await db.doc('counters/numbers').set({...S.counters,['quote'+y]:Math.trunc(num($('#n-q').value)),['invoice'+y]:Math.trunc(num($('#n-f').value)),invoiceConfirmed:$('#n-ok').checked});toast('Numérotation enregistrée.')}

start();
</script>
