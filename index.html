<!doctype html>
<html lang="fr">
<head>

<title>DOE Auto</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d5dbe2;
  --accent:#1d4ed8; --accent-soft:#e3eafc; --ok:#15803d; --ok-soft:#e2f4e8; --warn:#b45309; --warn-soft:#fbefdc; --bad:#b91c1c; --bad-soft:#fbe4e4;
  --paper:#fbfcfd;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#97a3b0; --line:#2c3642;
  --accent:#7aa2ff; --accent-soft:#1d2b4a; --ok:#5fd08a; --ok-soft:#163223; --warn:#f0b260; --warn-soft:#3a2a12; --bad:#f08a8a; --bad-soft:#3d1a1a;
  --paper:#161c23; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
header.top{padding-block:16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.01em;cursor:pointer}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.mainnav{display:flex;gap:6px;flex-wrap:wrap}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 2px;border-radius:8px;cursor:pointer;min-width:0}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,label.up:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:16px;padding-top:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;text-wrap:balance}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.narrow{max-width:420px;margin:40px auto 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr} .tabs button{font-size:11.5px;padding:8px 1px}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:12.5px;min-height:170px;resize:vertical;white-space:pre;overflow-x:auto}
textarea.mail{font-family:var(--f-body);font-size:13.5px;white-space:pre-wrap;min-height:220px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{font-size:13px;padding:6px 10px}
.btn.danger{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:wait}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--accent)}
.card .meta{font-size:13px;color:var(--muted)}
.lot{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lot>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lot>header h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px;min-width:0}
.num{font-family:var(--f-mono);color:var(--accent);font-weight:500;margin-right:6px}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.item:last-child{border-bottom:0}
.item .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .t>div{min-width:0}
.qty{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.prod{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:inherit;font-size:12px;font-weight:500;border-radius:99px;padding:3px 10px;border:1px solid transparent;display:inline-flex;align-items:center;gap:5px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
button.chip{cursor:pointer}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.up{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;border:1px dashed var(--accent);border-radius:6px;padding:4px 9px;white-space:nowrap;position:relative}
.up input{position:absolute;width:1px;height:1px;opacity:0;left:0;top:0}
.badge{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px -16px rgba(0,0,0,.25)}
.cover{border:2px solid var(--ink);padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.cover .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cover .ttl{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.1;margin:0;text-wrap:balance}
.cover dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13.5px}
.cover dt{color:var(--muted)} .cover dd{margin:0;font-weight:500;min-width:0}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:14px}
.toc li{display:flex;gap:8px;align-items:baseline;padding:4px 0}
.toc li.sec{font-weight:600;padding-top:10px}
.toc .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:12px}
.toc .st{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)}
.toc .lbl{min-width:0}
.att{border-top:1px solid var(--line);padding-top:14px;font-size:13.5px;display:flex;flex-direction:column;gap:8px;break-inside:avoid}
.att h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:15px}
.att p{margin:0;max-width:68ch}
.sign{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);z-index:50}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Affichage ordinateur ===== */
@media (min-width:1024px){
  body{font-size:15.5px}
  .wrap{max-width:1320px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  header.top{position:sticky;top:0;z-index:6;background:var(--bg);padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .brand{font-size:26px}
  .tabs{top:64px;grid-template-columns:repeat(5,minmax(0,170px));justify-content:start}
  .tabs button{font-size:14px;padding:9px 10px}
  h1{font-size:26px}
  .grid2{grid-template-columns:repeat(3,minmax(0,1fr))}
  .narrow{max-width:460px}
  /* listes en grille : chantiers, bibliothèque, relances, attestations */
  .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .list.chs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .list>.empty{grid-column:1/-1}
  /* onglets Devis et Pièces : les lots sur deux colonnes */
  .panel.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px}
  .panel.cols>*:not(.lot){grid-column:1/-1}
  /* onglet DOE : réglages à gauche, aperçu à droite */
  .sheet{padding:40px 48px}
  .ptable{font-size:14px}
  .ptable td:first-child{min-width:320px}
}
@media (min-width:1600px){ .wrap{max-width:1520px} .list.chs{grid-template-columns:repeat(4,minmax(0,1fr))} }
/* Attestation de pose au format MAGENCIA (modèle FNTP) */
.attp{border:1px solid var(--line);border-radius:4px;padding:22px 24px}
/* Page de garde (aperçu écran) */
.cover .clogo{max-height:56px;max-width:200px;object-fit:contain;align-self:flex-start}
.cover .cphoto{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:1px solid var(--line);max-width:100%}
.cover .csoc{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.pickph{display:flex;gap:6px;flex-wrap:wrap}
.pickph button{padding:0;border:2px solid transparent;border-radius:6px;background:none;cursor:pointer}
.pickph button[aria-pressed="true"]{border-color:var(--accent)}
.pickph img{width:64px;height:48px;object-fit:cover;border-radius:4px;display:block}
.logo-prev{max-height:70px;max-width:220px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px}
/* Prix d'achat */
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable tr.grp td{background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.ptable .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ptable input.pcell{font:inherit;font-family:var(--f-mono);font-size:13px;width:92px;text-align:right;padding:5px 7px;background:var(--ok-soft);color:var(--ok);border:1px solid transparent;border-radius:5px}
.ptable input.pcell.vide{background:var(--paper);color:var(--muted);border-color:var(--line)}
.ptable select{font-size:12.5px;padding:4px 6px;max-width:220px}
.ptable .m{font-size:12px;color:var(--muted)}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cout{font-family:var(--f-mono);font-size:12.5px;color:var(--ok)}
.bulk-log{font-family:var(--f-mono);font-size:12px;max-height:220px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;white-space:pre-wrap}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;--paper:#fff;--accent:#1d4ed8;color-scheme:light}
  body *{visibility:hidden}
  body[data-print="doe"] #sheet, body[data-print="doe"] #sheet *{visibility:visible}
  body[data-print="doe"] #sheet{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;padding:0}
  body[data-print="att"] #atts, body[data-print="att"] #atts *{visibility:visible}
  body[data-print="att"] #atts{position:absolute;left:0;top:0;width:100%}
  .cover{break-after:page}
  .attp{break-before:page;border:0;padding:0}
  #atts .attp:first-child{break-before:auto}
}
</style>

async function q(p){ const {data,error}=await p; if(error){ console.error(error); toast(messageErreur(error)); throw error; } return data; }

  const d=norm(des);
  if(/^(demolition|depose|curage|nettoyage|installation de chantier|evacuation|benne|protection|location)/.test(d)) return null;
  const D=" "+motsN(des).join(" ")+" ";
  let best=null, pos=Infinity, len=0;
  S.produits.forEach(p=>(p.mots_cles||[]).forEach(k=>{ const K=motsN(k).join(" "); if(!K) return; const i=D.indexOf(" "+K+" ");
    if(i>=0 && (i<pos || (i===pos && K.length>len))){ pos=i; len=K.length; best=p; } }));
  if(best) return best;
  let score=0, ex=false; best=null;
  S.produits.forEach(p=>{
    const W=motsN(p.nom).filter(w=>!VIDES.has(w)); let top=0;
    for(let a=0;a<W.length;a++) for(let b=a+2;b<=W.length;b++){ const seq=W.slice(a,b); if(D.includes(" "+seq.join(" ")+" ")) top=Math.max(top,seq.length); }
    if(top>=2){ if(top>score){ score=top; best=p; ex=false; } else if(top===score) ex=true; }
  });
  if(best) return ex?null:best;
  // 3) un mot rare du nom (marque ou gamme : Tonga, Ekla, Taralay…) présent dans un seul produit
  const freq={}; S.produits.forEach(p=>new Set(motsN(p.nom)).forEach(w=>freq[w]=(freq[w]||0)+1));
  const cands=S.produits.filter(p=>motsN(p.nom).some(w=>w.length>=4&&!/^\d+$/.test(w)&&!GENERIQUES.has(w)&&freq[w]===1&&D.includes(" "+w+" ")));
  return cands.length===1?cands[0]:null;
}
/* Lecture du devis collé (Excel, Obat…) : colonnes repérées par l'en-tête, sinon devinées ligne par ligne */
const RE_UNITE=/^(m²|m2|m³|m3|ml|m|u|un|unité|unite|ens|ensemble|ft|forfait|fft|kg|t|l|h|j|pce|pièce|piece|pm|lot|m\.l\.|mètre|metre)\.?$/i;
const RE_NUM=/^\d+(\.\d+)*\.?$/;
const nombre=s=>{ s=String(s||""); if(/€|%/.test(s)) return null; s=s.replace(/\s/g,"").replace(",","."); return s!==""&&!isNaN(s)?Number(s):null; };
const RE_QU=/^(\d[\d\s.,]*)\s+(m²|m2|m³|m3|ml|m|u|un|ens|ft|forfait|fft|kg|t|l|h|j|pce|pm|lot)\.?$/i;
function parseDevis(txt){
  // cellule « 153,82 m² » (PDF) → deux cellules quantité / unité
  const rows=txt.split(/\r?\n/).map(r=>r.split(/\t|;/).map(x=>(x||"").trim()).flatMap(c=>{ const m=c.match(RE_QU); return m?[m[1].trim(),m[2]]:[c]; })).filter(r=>r.some(Boolean));
  // 1. En-tête : colonnes nommées
  let map=null;
  const hi=rows.findIndex(r=>r.some(c=>/d[ée]signation|libell[ée]|description/i.test(c)));
  if(hi>=0 && hi<60){
    const H=rows[hi].map(c=>norm(c));
    const f=re=>H.findIndex(c=>re.test(c));
    map={n:f(/^(n°?|no|num|numero|ref|item|code|poste)$|^n[°o]/),des:f(/designation|libelle|description/),u:f(/^(u|unite|un|uv)$|unite/),q:f(/^(q|qte|quantite|qt)\.?$|quantite|qte/)};
    if(map.des<0 || map.q<0 || map.u===map.q || rows[hi].length!==Math.max(...rows.slice(hi+1,hi+6).map(r=>r.length),0)) map=null;
  }
  const lots=[]; let cur=null, auto=0, last=null;
  const numerote=rows.filter(r=>RE_NUM.test(r[0]||"")).length>=3;
  const PARASITE=/siret|r\.?c\.?s|capital|iban|bic\b|page\s*\d|t[ée]l\.?\s*:|www\.|@|net [àa] payer|bon pour accord|signature|conditions de|acompte|garantie d[ée]cennale|couverture :/i;
  rows.forEach((r,ri)=>{
    if(hi>=0 && hi<60 && ri<=hi) return;
    let n="",des="",u="",q=null;
    if(map){
      n=map.n>=0?r[map.n]||"":""; des=r[map.des]||""; u=map.u>=0?r[map.u]||"":""; q=map.q>=0?nombre(r[map.q]):null;
    } else {
      // 2. Sans en-tête : n° = cellule type 1.2, désignation = plus long texte, unité = cellule unité, quantité = 1er nombre après la désignation
      const cells=r.map((c,k)=>({c,k}));
      const num=cells.find(x=>RE_NUM.test(x.c)&&x.k===0);
      const texts=cells.filter(x=>x.c&&nombre(x.c)===null&&!RE_UNITE.test(x.c)&&x!==num);
      const d=texts.sort((a,b)=>b.c.length-a.c.length)[0];
      if(!d) return;
      des=d.c; n=num?num.c:"";
      const uc=cells.find(x=>RE_UNITE.test(x.c)); u=uc?uc.c:"";
      const nums=cells.filter(x=>x!==num&&x.k>d.k&&nombre(x.c)!==null);
      q=nums.length?nombre(nums[0].c):null;
    }
    if(!des || /^(total|sous-total|montant|tva|net a payer|designation)/i.test(norm(des)) || PARASITE.test(r.join(" "))) return;
    const estTitre=!u && q===null;
    // Désignation sur plusieurs lignes (PDF) : une ligne sans n°, sans unité ni quantité prolonge la précédente
    if(estTitre && numerote && !n && last){ last.designation+=" "+des; return; }
    if(estTitre){ cur={numero:n||String(lots.length+1),designation:des,lignes:[]}; lots.push(cur); last=null; return; }
    if(!cur){ cur={numero:"1",designation:"Travaux",lignes:[]}; lots.push(cur); }
    auto++;
    last={numero:n||`${cur.numero}.${cur.lignes.length+1}`,designation:des,unite:u,quantite:q};
    cur.lignes.push(last);
  });
  return lots.filter(l=>l.lignes.length);
}

/* Fichier devis → texte à colonnes séparées par tabulation */
async function fichierDevisEnTexte(f){
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  if(ext==="pdf"){
    if(!window.pdfjsLib) throw new Error("lecteur PDF non chargé, recharge la page");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; const out=[];
    for(let p=1;p<=pdf.numPages;p++){
      const tc=await (await pdf.getPage(p)).getTextContent();
      const items=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5],w:i.width}));
      items.sort((a,b)=>b.y-a.y||a.x-b.x);
      const lignes=[]; items.forEach(i=>{ const L=lignes.find(l=>Math.abs(l.y-i.y)<3); if(L) L.it.push(i); else lignes.push({y:i.y,it:[i]}); });
      lignes.sort((a,b)=>b.y-a.y).forEach(l=>{ l.it.sort((a,b)=>a.x-b.x); let t="", fin=null;
        l.it.forEach(i=>{ if(fin===null) t=i.s; else t+=(i.x-fin>9?"\t":" ")+i.s; fin=i.x+i.w; }); out.push(t); });
    }
    return out.join("\n");
  }
  if(ext==="xlsx"||ext==="xls"){
    if(!window.XLSX) throw new Error("lecteur Excel non chargé, recharge la page");
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    return XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{FS:"\t",blankrows:false});
  }
  return await f.text();
}

const prixDe = pid=> pid ? S.prix.filter(x=>x.produit_id===pid && x.prix_ht!=null).sort((a,b)=>String(b.date_prix||"").localeCompare(String(a.date_prix||"")))[0]||null : null;
const normU = u=>norm(u).replace("m2","m²").replace(/^(u|un|unite|pce|piece|pi)$/,"u").replace(/^(m|ml|metre lineaire)$/,"ml").trim();

function coutLigne(li){

}

function stats(){
  const p=S.rows.filter(r=>r.piece_requise_id); const c={en_bibliotheque:0,expiree:0,demandee:0,manquante:0};
  p.forEach(r=>c[r.statut]++);
  const photoLots=S.lots.filter(l=>(S.photos[l.id]||[]).length).length;
  const total=p.length+S.lots.length;
  return {...c,photoLots,total:p.length,pct: total?Math.round((c.en_bibliotheque+photoLots)/total*100):0};
}

function manquantesParFournisseur(){
  const out={}, vus=new Set();
  S.rows.forEach(r=>{ if(!r.piece_requise_id || r.statut==="en_bibliotheque") return;
    if(vus.has(r.piece_requise_id)) return; vus.add(r.piece_requise_id);
    const k=r.fournisseur_id||"aucun"; (out[k]=out[k]||{id:r.fournisseur_id,nom:r.fournisseur_nom||"Fournisseur non renseigné",pieces:[]}).pieces.push(r); });
  return Object.values(out);
}

  const mat=c.budget_matiere!=null?Number(c.budget_matiere):matAuto;
  const mo=(Number(c.heures_prevues)||0)*(Number(c.taux_horaire)||0);
  const prev={materiaux:mat,main_oeuvre:mo,sous_traitance:Number(c.budget_st)||0,location:0,transport:0,autre:Number(c.budget_autres)||0};
  const reel={}; CATS.forEach(([k])=>reel[k]=0); (S.depenses||[]).forEach(d=>{ reel[d.categorie]=(reel[d.categorie]||0)+Number(d.montant_ht); });
  const tp=Object.values(prev).reduce((a,b)=>a+b,0), tr=Object.values(reel).reduce((a,b)=>a+b,0);
  return {matAuto,prev,reel,tp,tr,ca:Number(c.montant_ht)||0,av:Number(c.avancement)||0};
}

/* Avant de (re)générer : répare les lignes mal lues à l'import et associe les produits de la bibliothèque */
async function reparerEtAssocier(){
  await loadBiblio(); let corr=0, sup=0, asso=0;
  for(const l of S.lots){ let k=0;
    for(const li of l.lignes_devis){ k++;
      const upd={};
      // en-tête importé par erreur
      if(/^(d[ée]signation|libell[ée]|description|n°?)$/i.test((li.numero||"").trim())||/^(d[ée]signation|quantit[ée]|qt[ée])$/i.test((li.designation||"").trim())){
        await q(sb.from("lignes_devis").delete().eq("id",li.id)); sup++; continue; }
      // colonnes décalées : texte dans « N° », nombre dans « Désignation »
      if(/[a-zà-ÿ]{3}/i.test(li.numero||"") && !/[a-zà-ÿ]{3}/i.test(li.designation||"")){
        upd.designation=li.numero; const qn=nombre(li.designation); if(qn!==null) upd.quantite=qn; upd.numero=`${l.numero}.${k}`; corr++; }
      const des=upd.designation||li.designation;
      if(!li.produit_id){ const p=matchProduit(des); if(p){ upd.produit_id=p.id; asso++; } }
      if(Object.keys(upd).length) await q(sb.from("lignes_devis").update(upd).eq("id",li.id));
    }
  }
  await loadChantierData();
  return {corr,sup,asso};
}

/* Annexe : PDF tel quel, ou image (PNG/JPEG) placée sur une page A4 */
async function annexeEnPdf(bytes){
  const u=new Uint8Array(bytes.slice(0,4));
  const png=u[0]===0x89&&u[1]===0x50, jpg=u[0]===0xFF&&u[1]===0xD8;
  if(!png&&!jpg) return await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const doc=await PDFLib.PDFDocument.create();
  const img=png?await doc.embedPng(bytes):await doc.embedJpg(bytes);
  const W=595.28,H=841.89,m=30, s=Math.min((W-2*m)/img.width,(H-2*m)/img.height);
  const page=doc.addPage([W,H]); page.drawImage(img,{x:(W-img.width*s)/2,y:(H-img.height*s)/2,width:img.width*s,height:img.height*s});
  return doc;
}
async function genererDOE(){
  const log=m=>{ S.doeLog=(S.doeLog||"")+m+"\n"; const el=$("#doe-log"); if(el){ el.textContent=S.doeLog; el.scrollTop=1e9; } };
  S.doeLog=""; if(S.doeUrl){ URL.revokeObjectURL(S.doeUrl); S.doeUrl=null; } S.doeChantier=S.ch.id; render(); log("Préparation du DOE…");
  window.onerror=(m)=>log("✗ Erreur : "+m);
  if(!window.PDFLib||!window.html2canvas||!window.jspdf){ log("✗ Bibliothèques PDF non chargées : recharge la page."); return; }
  await loadChantierData();
  try{ const r=await reparerEtAssocier();
    log(`Devis vérifié : ${r.asso} ligne(s) associée(s) à un produit${r.corr?`, ${r.corr} ligne(s) corrigée(s)`:""}${r.sup?`, ${r.sup} ligne(s) d'en-tête supprimée(s)`:""}.`);
  }catch(err){ log("✗ Vérification du devis impossible : "+(err.message||err)); }
  const c=S.ch, e=S.ent, byL=rowsByLigne();
  const cfg=c.doe_config||{}, sec={garde:true,sommaire:true,ident:true,ouvrages:true,attestations:true,photos:true,...(cfg.sections||{})};
  const exclus=new Set(cfg.exclus||[]);

  // 1. Annexes : documents joints, sans doublons, dans l'ordre du devis
  const annexes=[], vus=new Set();
  S.lots.forEach(l=>l.lignes_devis.forEach(li=>(byL[li.id]||[]).forEach(r=>{
    if(r.statut==="en_bibliotheque" && r.storage_path && !vus.has(r.storage_path)){ vus.add(r.storage_path);
      annexes.push({path:r.storage_path,titre:`${r.produit_nom} — ${r.piece_libelle}`,lot:l.numero}); }
  })));
  for(let k=annexes.length-1;k>=0;k--) if(exclus.has(annexes[k].path)) annexes.splice(k,1);
  (cfg.extras||[]).forEach(x=>annexes.push({path:x.path,titre:x.titre,lot:"—"}));
  log(`${annexes.length} document(s) à joindre en annexe.`);
  const annexPdfs=[];
  for(const [i,a] of annexes.entries()){
    try{
      const {data,error}=await sb.storage.from("documents").createSignedUrl(a.path,600); if(error) throw error;
      const bytes=await (await fetch(data.signedUrl)).arrayBuffer();
      const pdf=await annexeEnPdf(bytes);
      annexPdfs.push({...a,pdf,bytes,pages:pdf.getPageCount()}); log(`✓ Annexe ${i+1} : ${a.titre} (${pdf.getPageCount()} p.)`);
    }catch(err){ log(`✗ Annexe ignorée : ${a.titre} (${err.message||err})`); }
  }

  // 2. Ouvrages réalisés et matériaux mis en œuvre : toutes les lignes du devis
  const mats=[];
  S.lots.forEach(l=>{ mats.push({titre:`${l.numero} ${l.designation}`});
    l.lignes_devis.forEach(li=>{ const rs=(byL[li.id]||[]).filter(r=>r.produit_id); const r0=rs[0];
      mats.push({n:li.numero||"",des:li.designation,q:li.quantite!=null?String(+li.quantite).replace(".",","):"",u:li.unite||"",
        produit:r0?r0.produit_nom:"",docs:r0?[...new Set(rs.filter(r=>r.piece_libelle).map(r=>r.piece_libelle+(r.statut==="en_bibliotheque"?"":" (manquant)")))].join(", "):""}); }); });
  const matChunks=[]; let cur=[], poids=0;
  mats.forEach(m=>{ const w=m.titre?1:1+Math.floor(String(m.des).length/70); if(poids+w>30&&cur.length){ matChunks.push(cur); cur=[]; poids=0; } cur.push(m); poids+=w; });
  if(cur.length||!matChunks.length) matChunks.push(cur);

  // 3. Photos
  const photoLots=S.lots.filter(l=>(S.photos[l.id]||[]).length);
  const photoPages=[]; photoLots.forEach(l=>{ const ph=S.photos[l.id]; for(let i=0;i<ph.length;i+=6) photoPages.push({l,ph:ph.slice(i,i+6)}); });

  // 4. Pagination
  let p=1; const pg={};
  if(sec.garde) pg.garde=p++;
  if(sec.sommaire) pg.som=p++;
  if(sec.ident) pg.ident=p++;
  if(sec.ouvrages){ pg.mat=p; p+=matChunks.length; }
  if(sec.attestations){ pg.att=p; p+=S.lots.length; }
  if(sec.photos&&photoPages.length){ pg.photo=p; p+=photoPages.length; }
  pg.ann=p; annexPdfs.forEach(a=>{ a.debut=p; p+=a.pages; });
  const total=p-1;
  const lettres="ABCDEFG"; let li=0; const let_={};
  ["ident","ouvrages","attestations","photos"].forEach(k=>{ if(sec[k]&&(k!=="photos"||photoPages.length)) let_[k]=lettres[li++]; }); let_.annexes=lettres[li];
  const pMat=pg.mat, pAtt=pg.att, pPhoto=pg.photo, pAnn=pg.ann;

  // 5. Pages du dossier
  const pages=[];
  // Page de garde : logo, bandeau titre, grande photo, informations, bloc société
  let coverData=null; const cs=coverSrc();
  if(cs){ try{ coverData=await toDataURL(cs); }catch(err){ log("✗ Photo de couverture illisible : page de garde sans photo."); } }
  const soc=infosSociete(e), BLEU="#1a3f8f";
  const ligneInfo=(k,v)=>`<tr><td style="padding:5px 16px 5px 0;color:#5a6472;white-space:nowrap;vertical-align:top">${k}</td><td style="padding:5px 0;font-weight:600">${v}</td></tr>`;
  if(sec.garde) pages.push(`<div style="width:${A4W}px;height:${A4H}px;box-sizing:border-box;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column">
    <div style="padding:40px 56px 0;display:flex;justify-content:space-between;align-items:center;min-height:96px">
      ${S.logo?`<img src="${S.logo}" style="max-height:78px;max-width:260px;object-fit:contain">`:`<div style="font-size:24px;font-weight:800;color:${BLEU}">${esc(e.nom)}</div>`}
      <div style="text-align:right;font-size:11px;color:#5a6472;line-height:1.5">${esc([e.telephone&&"Tél. "+e.telephone].filter(Boolean).join(""))}${e.email?"<br>"+esc(e.email):""}${e.site_web?"<br>"+esc(e.site_web):""}</div>
    </div>
    <div style="margin-top:26px;background:${BLEU};color:#fff;padding:26px 56px 24px">
      <div style="font-size:13px;letter-spacing:.28em;font-weight:700;opacity:.9">DOSSIER DES OUVRAGES EXÉCUTÉS</div>
      <div style="font-size:36px;font-weight:800;line-height:1.12;margin-top:10px">${esc(c.nom)}</div>
      ${c.designation_travaux?`<div style="font-size:16px;margin-top:8px;opacity:.95">${esc(c.designation_travaux)}</div>`:""}
    </div>
    <div style="padding:26px 56px 0;flex:1;display:flex;flex-direction:column;gap:22px;min-height:0">
      ${coverData?`<div style="height:420px;border-radius:4px;overflow:hidden;border:1px solid #cfd6df"><img src="${coverData}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`
        :`<div style="height:420px;border:2px dashed #cfd6df;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#9aa3ad;font-size:14px">Photo du chantier</div>`}
      <table style="font-size:14px;border-collapse:collapse">
        ${ligneInfo("Lieu des travaux",esc(c.adresse||"—"))}${ligneInfo("Maître d'ouvrage",esc(c.maitre_ouvrage||"—"))}
        ${ligneInfo("Maître d'œuvre",esc(c.maitre_oeuvre||"—"))}${ligneInfo("Date de réception",frDate(c.date_reception))}
        ${c.date_debut||c.date_fin?ligneInfo("Période des travaux",esc([c.date_debut,c.date_fin].filter(Boolean).join(" → "))):""}
      </table>
    </div>
    <div style="margin:0 56px 40px;border-top:3px solid ${BLEU};padding-top:12px;font-size:11px;color:#333;line-height:1.55">
      ${soc.map((l,i)=>`<div style="${i?"":"font-weight:700;font-size:12.5px;color:"+BLEU}">${esc(l)}</div>`).join("")}
      <div style="color:#7a838e;margin-top:4px">Édité le ${new Date().toLocaleDateString("fr-FR")}</div>
    </div></div>`);
  const ligneSom=(t,pg,ind)=>`<div style="display:flex;gap:8px;padding:5px 0;${ind?"padding-left:22px;font-size:12px":"font-weight:700"}"><span>${t}</span><span style="flex:1;border-bottom:1px dotted #999;transform:translateY(-4px)"></span><span>${pg}</span></div>`;
  let som=H2("Sommaire")+(sec.ident?ligneSom(`${let_.ident}. Identification du chantier`,pg.ident):"")
    +(sec.ouvrages?ligneSom(`${let_.ouvrages}. Ouvrages réalisés et matériaux mis en œuvre`,pMat):"")
    +(sec.attestations?ligneSom(`${let_.attestations}. Attestations de pose`,pAtt)+S.lots.map((l,i)=>ligneSom(`${esc(l.numero)} ${esc(l.designation)}`,pAtt+i,1)).join(""):"")
    +(let_.photos?ligneSom(`${let_.photos}. Photos de fin de travaux`,pPhoto):"")
    +ligneSom(`${let_.annexes}. Annexes — fiches techniques, PV et documents`,annexPdfs.length?pAnn:"—")
    +annexPdfs.slice(0,22).map((a,i)=>ligneSom(`Annexe ${i+1} — ${esc(a.titre)}`,a.debut,1)).join("")

  log("Fusion des annexes…");
  const final=await PDFLib.PDFDocument.load(doc.output("arraybuffer"));
  for(const a of annexPdfs){ try{ const pgs=await final.copyPages(a.pdf,a.pdf.getPageIndices()); pgs.forEach(pg=>final.addPage(pg)); }catch(err){ log(`✗ Fusion impossible : ${a.titre}`); } }
  final.setTitle(`DOE ${c.nom}`); final.setAuthor(e.nom);
  const out=await final.save();
  const blob=new Blob([out],{type:"application/pdf"}); const url=URL.createObjectURL(blob);
  const nom=`DOE_${safeName(c.nom).toUpperCase()}.pdf`;
  S.doeUrl=url; S.doeNom=nom;
  try{ const lk=document.createElement("a"); lk.href=url; lk.download=nom; document.body.appendChild(lk); lk.click(); lk.remove(); }catch(err){}

  // Archive dans Supabase
  try{ const path=`${e.id}/chantiers/${c.id}/${Date.now()}-${nom}`; const {error}=await sb.storage.from("doe").upload(path,blob,{contentType:"application/pdf"});
    if(!error){ await sb.from("doe_exports").insert({entreprise_id:e.id,chantier_id:c.id,storage_path:path,completude:stats().pct}); log("✓ Copie archivée dans DOE Auto (conservation 10 ans)."); } else log("✗ Archive impossible : "+messageErreur(error)); }catch(err){ log("✗ Archive impossible : "+(err.message||err)); }
  // Dossier complet : DOE + chaque fiche technique / PV en fichier séparé, dans un ZIP
  if(window.JSZip){
    try{
      log("Création du dossier complet (ZIP)…");
      const zip=new JSZip(); zip.file(nom,out);
      const dir=zip.folder("Fiches techniques et PV");
      annexPdfs.forEach((a,i)=>{
        const u=new Uint8Array(a.bytes.slice(0,2)); const ext=u[0]===0x89?"png":u[0]===0xFF?"jpg":"pdf";
        const t=`${String(i+1).padStart(2,"0")} - Lot ${a.lot} - ${a.titre}`.replace(/[\/:*?"<>|]+/g,"-").slice(0,120);
        dir.file(`${t}.${ext}`,a.bytes);
      });
      const zb=await zip.generateAsync({type:"blob",compression:"STORE"});
      const zname=nom.replace(/\.pdf$/i,"_complet.zip");
      const zpath=`${e.id}/chantiers/${c.id}/${Date.now()}-${zname}`;
      const {error:ze}=await sb.storage.from("doe").upload(zpath,zb,{contentType:"application/zip"});
      if(ze) log("✗ Dossier ZIP non archivé : "+messageErreur(ze));
      else { await sb.from("doe_exports").insert({entreprise_id:e.id,chantier_id:c.id,storage_path:zpath,completude:stats().pct});
        log(`✓ ${zname} : DOE + ${annexPdfs.length} fiches et PV séparés (${(zb.size/1048576).toFixed(1)} Mo).`); }
    }catch(err){ log("✗ Dossier ZIP impossible : "+(err.message||err)); }
  }
  try{ const ex=await sb.from("doe_exports").select("*").eq("chantier_id",c.id).order("created_at",{ascending:false}).limit(6); if(!ex.error) S.exports=ex.data; }catch(err){}
  log("→ Si le fichier n'est pas dans tes Téléchargements, utilise le bouton « Télécharger » ci-dessous.");
  render();
}

/* ---- Import groupé : nom de fichier → produit + type de pièce ---- */
const MOTS_DOC = /\b(pv|feu|acoustique|fiche|fiches|technique|produit|ft|ftprod|fdes|fds|fichetechnique)\b/g;
function analyseNom(fichier){
  let n=fichier.replace(/\.pdf$/i,"").replace(/^[\d.]+\s+/,"").replace(/[+_]/g," ").replace(/\s+/g," ").trim();
  const all=n.split(/\s+-\s+/);
  const estDoc=p=>norm(p).replace(MOTS_DOC,"").replace(/[\s-]/g,"")==="";
  const docPart=norm(all.filter(estDoc).join(" "));
  const t=docPart||norm(n);
  let type="Fiche technique";
  if(/\bfdes\b|environnementale/.test(t)) type="FDES";
  else if(/\bfds\b/.test(t)) type="Fiche de données de sécurité";
  else if(/(^|[\s-])pv([\s-]|$)|proces.verbal/.test(t)) type = /acousti/.test(t) ? "PV acoustique" : /feu|\b(r|e|ei|rei)\s?\d{2,3}\b|coupe.feu|\bcf\b/.test(t) ? "PV feu" : "PV";
  else if(/fiche[\s-]produit/.test(t)) type="Fiche produit";
  let parts=all.filter(p=>!estDoc(p));
  let nom=(parts.length?parts.join(" - "):n);
  for(let i=0;i<3;i++) nom=nom.replace(/^(ftprod|fichetechnique|fiche[\s-]technique|fiche[\s-]produit|fiche|ft|pv)[\s.-]+/i,"").trim();
  nom=nom.replace(/[\s-]+(ft|pv|fiche technique)$/i,"").trim();
  if(!nom || norm(nom).replace(MOTS_DOC,"").trim()==="") nom=fichier.replace(/\.pdf$/i,"");
  return {nom, type};
}
async function importGroupe(input){
  const files=[...input.files]; if(!files.length) return;
  const ent=S.ent.id; let ok=0, err=0;
  const log=m=>{ S.bulkLog=(S.bulkLog||"")+m+"\n"; const el=$("#bulk-log"); if(el){ el.textContent=S.bulkLog; el.scrollTop=1e9; } };
  S.bulkLog=""; render(); log(`${files.length} fichier(s) à importer…`);
  await loadBiblio();
  for(const f of files){
    try{
      if(f.size>50*1024*1024){ log(`✗ ${f.name} : trop lourd (plus de 50 Mo)`); err++; continue; }
      const {nom,type}=analyseNom(f.name);
      let p=S.produits.find(x=>norm(x.nom)===norm(nom));
      if(!p){
        const [np]=await q(sb.from("produits").insert({entreprise_id:ent,nom,mots_cles:[]}).select());
        p={...np,pieces_requises:[]}; S.produits.push(p);
      }
      let lib=type, k=2;
      while(p.pieces_requises.some(r=>norm(r.libelle)===norm(lib) && r.documents && r.documents.length)) lib=`${type} ${k++}`;
      let piece=p.pieces_requises.find(r=>norm(r.libelle)===norm(lib));
      if(!piece){
        const [npc]=await q(sb.from("pieces_requises").insert({entreprise_id:ent,produit_id:p.id,libelle:lib,ordre:p.pieces_requises.length}).select());
        piece={...npc,documents:[]}; p.pieces_requises.push(piece);
      }
      const path=`${ent}/produits/${p.id}/${Date.now()}-${safeName(f.name)}`;
      const {error}=await sb.storage.from("documents").upload(path,f,{contentType:"application/pdf"});
      if(error) throw error;
      await q(sb.from("documents").insert({entreprise_id:ent,piece_requise_id:piece.id,storage_path:path,nom_fichier:f.name,source:"upload"}));
      piece.documents.push({storage_path:path,nom_fichier:f.name,created_at:new Date().toISOString()});
      ok++; log(`✓ ${nom} — ${lib}`);
    }catch(e){ err++; log(`✗ ${f.name} : ${messageErreur(e)}`); }
  }
  log(`Terminé : ${ok} importé(s)${err?`, ${err} en erreur`:""}.`);
  await loadBiblio(); render(); toast(`${ok} document(s) importé(s)`);
}

async function envoyerGmail(f){
  const to=$("#env-to").value.trim(); if(!to) return toast("Indique au moins un destinataire");
  const w=window.open("about:blank","_blank");   // ouvert tout de suite pour ne pas être bloqué
  const nom=f.dataset.path.split("/").pop().replace(/^\d+-/,"");
  const {data,error}=await sb.storage.from("doe").createSignedUrl(f.dataset.path,30*24*3600,{download:nom});
  if(error){ if(w) w.close(); return toast(messageErreur(error)); }
  const body=$("#env-txt").value.replace("[LIEN]",data.signedUrl);
  const p=new URLSearchParams({view:"cm",fs:"1",to,su:$("#env-obj").value,body});
  const cc=$("#env-cc").value.trim(); if(cc) p.set("cc",cc);
  if(S.user?.email) p.set("authuser",S.user.email);
  const url="https://mail.google.com/mail/?"+p.toString();
  if(w) w.location=url; else location.href=url;
  S.sendId=null; render(); toast("Gmail ouvert : relis le message et clique sur Envoyer");
}

      await loadEntreprise();
      if(sign){ await q(sb.from("membres").update({nom_affiche:sign}).eq("entreprise_id",S.ent.id).eq("user_id",S.user.id)); S.nomAffiche=sign; }
      await goHome(); toast("Entreprise créée");
    }
    if(k==="chantier"){
      const [c]=await q(sb.from("chantiers").insert({entreprise_id:S.ent.id,nom:$("#n-nom").value.trim(),adresse:$("#n-adr").value.trim()||null,
        maitre_ouvrage:$("#n-moa").value.trim()||null,maitre_oeuvre:$("#n-moe").value.trim()||null,date_reception:$("#n-date").value||null,signataire:$("#n-sign").value.trim()||null}).select());
      S.chantiers.unshift(c); await openChantier(c.id);
    }
    if(k==="infos"){
      const num=v=>{ v=String(v).replace(/\s|€|HT/gi,"").replace(",","."); return v===""?null:Number(v); };
      const upd={maitre_ouvrage:$("#i-moa").value.trim()||null,maitre_oeuvre:$("#i-moe").value.trim()||null,designation_travaux:$("#i-des").value.trim()||null,
        adresse:$("#i-adr").value.trim()||null,date_debut:$("#i-deb").value.trim()||null,date_fin:$("#i-fin").value.trim()||null,
        montant_ht:num($("#i-mt").value),date_attestation:$("#i-date").value||null,accord_cadre:$("#i-ac").value==="true",
        sous_traite:$("#i-st").value==="true",montant_st:num($("#i-mst").value),nature_st:$("#i-nst").value.trim()||null};
      if([upd.montant_ht,upd.montant_st].some(x=>x!==null&&isNaN(x))) return toast("Montant invalide : écris un nombre, par exemple 56604,84");
      const [c]=await q(sb.from("chantiers").update(upd).eq("id",S.ch.id).select());
      S.ch=c; const i=S.chantiers.findIndex(x=>x.id===c.id); if(i>=0) S.chantiers[i]=c;
      render(); toast("Informations enregistrées");
    }
    if(k==="budget"||k==="depense"){
      const num=id=>{ const v=String($(id).value).replace(/\s|€/g,"").replace(",","."); return v===""?null:Number(v); };
      if(k==="budget"){
        const upd={montant_ht:num("#b-ca"),avancement:num("#b-av")??0,budget_matiere:num("#b-mat"),heures_prevues:num("#b-h"),taux_horaire:num("#b-t"),budget_st:num("#b-st"),budget_autres:num("#b-au")};
        if(Object.values(upd).some(v=>v!==null&&isNaN(v))) return toast("Montant invalide : écris un nombre, par exemple 1250,50");
        if(upd.avancement<0||upd.avancement>100) return toast("Avancement entre 0 et 100 %");
        const [c]=await q(sb.from("chantiers").update(upd).eq("id",S.ch.id).select());
        S.ch=c; const i=S.chantiers.findIndex(x=>x.id===c.id); if(i>=0) S.chantiers[i]=c; render(); toast("Budget enregistré");
      } else {
        const mt=num("#d-mt"); if(mt===null||isNaN(mt)) return toast("Montant invalide : écris par exemple 1250,50");
        let path=null; const file=$("#d-file").files[0];
        if(file){ path=`${S.ent.id}/chantiers/${S.ch.id}/factures/${Date.now()}-${safeName(file.name)}`;
          const {error}=await sb.storage.from("documents").upload(path,file,{contentType:file.type||"application/pdf"}); if(error){ toast(messageErreur(error)); return; } }
        await q(sb.from("depenses").insert({entreprise_id:S.ent.id,chantier_id:S.ch.id,categorie:$("#d-cat").value,date_depense:$("#d-date").value||null,
          fournisseur:$("#d-four").value.trim()||null,libelle:$("#d-lib").value.trim(),montant_ht:mt,reference:$("#d-ref").value.trim()||null,storage_path:path}));
        await loadChantierData(); render(); toast("Dépense ajoutée");
      }
    }
    if(k==="entreprise"){
      const v=id=>$("#e-"+id).value.trim()||null;
      if(!v("nom")) return toast("La raison sociale est obligatoire");
      const upd={nom:v("nom"),forme_juridique:v("forme"),capital:v("capital"),siret:v("siret"),adresse:v("adresse"),code_postal:v("cp"),ville:v("ville"),
        telephone:v("tel"),email:v("email"),site_web:v("web"),rcs:v("rcs"),ape:v("ape"),tva:v("tva"),qualifications:v("qualif"),assurance:v("assur")};
      await q(sb.from("entreprises").update(upd).eq("id",S.ent.id));
      await loadEntreprise(); render(); toast("Entreprise enregistrée");
    }
    if(k==="prix"){
      const v=String($("#np-prix").value).replace(/\s|€/g,"").replace(",","."); const n=v===""?null:Number(v);
      if(n!==null&&isNaN(n)) return toast("Prix non reconnu : écris par exemple 12,50");
      await q(sb.from("prix_achat").insert({entreprise_id:S.ent.id,famille:$("#np-fam").value,designation:$("#np-des").value.trim(),marque:$("#np-marque").value.trim()||null,
        unite:$("#np-unite").value.trim()||null,prix_ht:n,fournisseur:$("#np-four").value.trim()||null,date_prix:n!=null?new Date().toISOString().slice(0,10):null}));
      await loadPrix(); render(); toast("Prix ajouté");
    }
    if(k==="produit"){
      const split=v=>v.split(",").map(x=>x.trim()).filter(Boolean);
      await creerProduit({nom:$("#p-nom").value.trim(),dtu:$("#p-dtu").value.trim(),four:$("#p-four").value,mots:split($("#p-mots").value).map(norm),pieces:split($("#p-pieces").value)});
      await loadBiblio(); render(); toast("Produit ajouté");
    }
  });
});

/* ===================== DÉMARRAGE ===================== */
async function onSession(session){
  S.user=session?.user||null;
  if(!S.user){ S.ent=null; render(); return; }
  try{ await loadEntreprise(); if(S.ent) await goHome(); else render(); }
  catch(e){ $("#app").innerHTML=`<div class="narrow box"><h2>Connexion à la base impossible</h2><div class="err">${esc(messageErreur(e))}</div><button class="btn ghost" data-act="logout">Se déconnecter</button></div>`; }
}
let lastUid;
sb.auth.onAuthStateChange((ev,session)=>{
  const uid=session?.user?.id||null;
  if(ev==="TOKEN_REFRESHED" || (ev==="SIGNED_IN" && uid===lastUid)) return;
  lastUid=uid; onSession(session);
});
</script>
