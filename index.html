<!doctype html>
<html lang="fr">

<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d5dbe2;
  --accent:#1d4ed8; --accent-soft:#e3eafc; --ok:#15803d; --ok-soft:#e2f4e8; --warn:#b45309; --warn-soft:#fbefdc; --bad:#b91c1c; --bad-soft:#fbe4e4;
  --paper:#fbfcfd;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#97a3b0; --line:#2c3642;
  --accent:#7aa2ff; --accent-soft:#1d2b4a; --ok:#5fd08a; --ok-soft:#163223; --warn:#f0b260; --warn-soft:#3a2a12; --bad:#f08a8a; --bad-soft:#3d1a1a;
  --paper:#161c23; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
header.top{padding-block:16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.01em;cursor:pointer}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.mainnav{display:flex;gap:6px;flex-wrap:wrap}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 2px;border-radius:8px;cursor:pointer;min-width:0}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,label.up:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:16px;padding-top:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;text-wrap:balance}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.narrow{max-width:420px;margin:40px auto 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:12.5px;min-height:170px;resize:vertical;white-space:pre;overflow-x:auto}
textarea.mail{font-family:var(--f-body);font-size:13.5px;white-space:pre-wrap;min-height:220px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{font-size:13px;padding:6px 10px}
.btn.danger{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:wait}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--accent)}
.card .meta{font-size:13px;color:var(--muted)}
.lot{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lot>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lot>header h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px;min-width:0}
.num{font-family:var(--f-mono);color:var(--accent);font-weight:500;margin-right:6px}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.item:last-child{border-bottom:0}
.item .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .t>div{min-width:0}
.qty{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.prod{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:inherit;font-size:12px;font-weight:500;border-radius:99px;padding:3px 10px;border:1px solid transparent;display:inline-flex;align-items:center;gap:5px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
button.chip{cursor:pointer}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.up{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;border:1px dashed var(--accent);border-radius:6px;padding:4px 9px;white-space:nowrap;position:relative}
.up input{position:absolute;width:1px;height:1px;opacity:0;left:0;top:0}
.badge{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px -16px rgba(0,0,0,.25)}
.cover{border:2px solid var(--ink);padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.cover .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cover .ttl{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.1;margin:0;text-wrap:balance}
.cover dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13.5px}
.cover dt{color:var(--muted)} .cover dd{margin:0;font-weight:500;min-width:0}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:14px}
.toc li{display:flex;gap:8px;align-items:baseline;padding:4px 0}
.toc li.sec{font-weight:600;padding-top:10px}
.toc .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:12px}
.toc .st{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)}
.toc .lbl{min-width:0}
.att{border-top:1px solid var(--line);padding-top:14px;font-size:13.5px;display:flex;flex-direction:column;gap:8px;break-inside:avoid}
.att h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:15px}
.att p{margin:0;max-width:68ch}
.sign{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);z-index:50}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Attestation de pose au format MAGENCIA (modèle FNTP) */
.attp{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.attp h3{margin:0;font-family:var(--f-display);font-size:18px;text-align:center;letter-spacing:.02em}
.attp .sub{text-align:center;font-weight:700;letter-spacing:.3em;font-size:13px}
.attp table{width:100%;border-collapse:collapse}
.attp td{border:1px solid #444;padding:6px 8px;vertical-align:top}
.attp td.k{width:38%;font-weight:600;background:#f2f4f6}
.attp .fin{border:1px solid #444;padding:10px;display:flex;flex-direction:column;gap:6px}
.attp .sigbox{height:70px;border:1px dashed #888;margin-top:4px}
.attp .foot{font-size:10px;color:#666;text-align:right}
.attp .desc{white-space:pre-line}
/* Page Entreprise et aperçu de la page de garde */
.pv{position:relative;width:100%;max-width:420px;aspect-ratio:794/1123;overflow:hidden;border:1px solid var(--line);border-radius:4px;background:#fff;box-shadow:0 8px 24px -16px rgba(0,0,0,.3)}
.pv>div{position:absolute;left:0;top:0;transform-origin:0 0}
.ent-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px;align-items:start}
.ent-grid.garde{grid-template-columns:minmax(0,1fr) minmax(0,260px)}
@media (max-width:760px){.ent-grid,.ent-grid.garde{grid-template-columns:minmax(0,1fr)}}
.media{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.media .thumb{width:120px;height:72px;border:1px solid var(--line);border-radius:6px;background:var(--paper) center/contain no-repeat;flex:none}
.media .thumb.cov{background-size:cover}
input[type=color]{width:56px;height:36px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--paper);cursor:pointer}
.recherche{position:sticky;top:0;z-index:4;background:var(--bg);padding-block:8px;display:flex;gap:10px;align-items:center}
.recherche input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.recherche .hint{white-space:nowrap;font-family:var(--f-mono)}
.bulk-log{font-family:var(--f-mono);font-size:12px;max-height:220px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;white-space:pre-wrap}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;--paper:#fff;--accent:#1d4ed8;color-scheme:light}
  body *{visibility:hidden}
  body[data-print="doe"] #sheet, body[data-print="doe"] #sheet *{visibility:visible}
  body[data-print="doe"] #sheet{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;padding:0}
  body[data-print="att"] #atts, body[data-print="att"] #atts *{visibility:visible}
  body[data-print="att"] #atts{position:absolute;left:0;top:0;width:100%}
  .cover,.cover-pv{break-after:page}
  .cover-pv{border:0;box-shadow:none;max-width:none}
  .attp{break-before:page;border:0;padding:0}
  #atts .attp:first-child{break-before:auto}
}
</style>

<script>
/* ===================== CONFIG ===================== */
const SB_URL = "https://ngsokjiivtukcnpkggtz.supabase.co";
const SB_KEY = "sb_publishable_sXPzfDbrAxOXNkOn-Rvqcg_r6ApVmkI";
const sb = supabase.createClient(SB_URL, SB_KEY);

/* Bibliothèque de départ (chargée à la demande, sans documents) */
const LIB_DEPART = [
  {nom:"Plaque de plâtre BA13 + ossature 48", dtu:"DTU 25.41", f:"Négoce plâtrerie", mots:["cloison","ba13"], pieces:["Fiche technique plaque","Fiche technique ossature","PV de résistance au feu"]},
  {nom:"Complexe de doublage PSE 10+80", dtu:"DTU 25.42", f:"Négoce plâtrerie", mots:["doublage"], pieces:["Fiche technique","Certificat ACERMI"]},
  {nom:"Panneau laine minérale 45 mm", dtu:"DTU 25.41", f:"Négoce plâtrerie", mots:["isolant","laine"], pieces:["Fiche technique","Certificat ACERMI","FDES"]},
  {nom:"Dalle minérale 600×600 + ossature T24", dtu:"DTU 58.1", f:"Négoce plâtrerie", mots:["faux plafond","dalle"], pieces:["Fiche technique dalle","PV réaction au feu","Fiche technique ossature"]},
  {nom:"Enduit à joint + bande papier", dtu:"DTU 25.41", f:"Négoce plâtrerie", mots:["enduit","bande"], pieces:["Fiche technique"]},
  {nom:"Peinture acrylique mate intérieure", dtu:"DTU 59.1", f:"Distributeur peinture", mots:["peinture"], pieces:["Fiche technique","Fiche de données de sécurité"]},
  {nom:"Revêtement PVC en lés U3P3", dtu:"DTU 53.2", f:"Distributeur sols", mots:["pvc","lino","lvt"], pieces:["Fiche technique","PV classement UPEC","Notice d'entretien"]},
  {nom:"Plinthe MDF à peindre", dtu:"", f:"Négoce bois", mots:["plinthe"], pieces:["Fiche technique"]},
  {nom:"Bloc-porte âme pleine", dtu:"DTU 36.2", f:"Négoce bois", mots:["bloc-porte","porte"], pieces:["Fiche technique","Notice de pose","PV acoustique"]},
];
const EXEMPLE_DEVIS = `1;PLÂTRERIE - CLOISONS;;
1.1;Cloison 72/48 BA13 une peau de chaque côté;m²;84
1.2;Doublage collé 10+80 sur murs périphériques;m²;46
1.3;Isolant laine minérale 45 mm dans cloisons;m²;84
1.4;Faux plafond dalles 600x600 sur ossature;m²;120
2;PEINTURE;;
2.1;Enduit de lissage et bandes sur plaques;m²;210
2.2;Peinture acrylique mate 2 couches murs;m²;210
3;REVÊTEMENTS DE SOL;;
3.1;Sol PVC en lés U3P3 compris ragréage;m²;95
3.2;Plinthes bois à peindre;ml;62
4;MENUISERIES INTÉRIEURES;;
4.1;Bloc-porte âme pleine 83x204;u;6`;

const LBL = {en_bibliotheque:"jointe", expiree:"expirée", demandee:"demandée", manquante:"manquante"};
const CLS = {en_bibliotheque:"ok", expiree:"bad", demandee:"warn", manquante:"bad"};

/* ===================== ÉTAT ===================== */
const S = { user:null, ent:null, role:null, nomAffiche:"", view:"chantiers", tab:"pieces",
  chantiers:[], ch:null, lots:[], rows:[], photos:{}, produits:[], fourn:[], confirmReplace:false, authMode:"login",
  media:{} /* images de la page de garde, en data URL, rangées par chemin de stockage */ };

/* ===================== OUTILS ===================== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const frDate = d=>d? new Date(d+"T12:00:00").toLocaleDateString("fr-FR") : "—";
const safeName = n=>norm(n).replace(/[^a-z0-9.]+/g,"-").replace(/^-+|-+$/g,"").slice(-80) || "fichier";
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }
async function q(p){ const {data,error}=await p; if(error){ console.error(error); toast(messageErreur(error)); throw error; } return data; }
function messageErreur(e){
  const m=e.message||String(e);
  if(/Invalid login/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if(/Email not confirmed/i.test(m)) return "Confirme d'abord ton e-mail (lien reçu par mail).";
  if(/permission denied/i.test(m)) return "Accès refusé par la base : vérifie les droits (voir la notice).";
  if(/row-level security/i.test(m)) return "Action refusée : cet élément n'appartient pas à ton entreprise.";
  if(/sans_fiche/i.test(m)) return "La base n'est pas à jour : lance maj-lignes.sql dans Supabase.";
  if(/supprimer_(produit|piece)/i.test(m)) return "La base n'est pas à jour : lance supprimer-produit.sql dans Supabase.";
  if(/schema cache|column .* does not exist/i.test(m)) return "La base n'est pas à jour : lance maj-entreprise.sql dans Supabase.";
  return m;
}
async function busy(btn, fn){ if(btn) btn.disabled=true; try{ await fn(); } catch(e){} finally{ if(btn) btn.disabled=false; } }

/* Reconnaissance produit : le mot-clé qui apparaît le plus tôt dans la désignation gagne */
const MOTS_VIDES=new Set("avec pour dans sans sous entre compris fourniture pose mise oeuvre ensemble type selon toute hauteur fiche technique produit produits les des une sur par".split(" "));
const motsUtiles=t=>norm(t).replace(/[^a-z0-9/]+/g," ").split(" ").filter(w=>w.length>=4&&!MOTS_VIDES.has(w)||/\d/.test(w)&&w.length>=3||MOTS_COURTS.has(w));
const MOTS_COURTS=new Set("wc pvc vmc led mdf osb pse ba hpl".split(" "));
function matchProduit(des){
  const d=norm(des); let best=null, pos=Infinity;
  S.produits.forEach(p=>(p.mots_cles||[]).forEach(k=>{ const i=d.indexOf(norm(k)); if(k && i>=0 && i<pos){ pos=i; best=p; } }));
  if(best) return best;
  // Sinon : mots du nom du produit retrouvés dans la ligne (une marque compte double), au moins 2 points
  const md=new Set(motsUtiles(des)); let score=0;
  S.produits.forEach(p=>{ let sc=0; new Set(motsUtiles(p.nom)).forEach(w=>{ if(md.has(w)) sc+=MARQUES[w]?2:1; }); if(sc>score){ score=sc; best=p; } });
  return score>=2?best:null;
}
function parseDevis(txt){
  const lots=[]; let cur=null;
  txt.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    const [n,des,u,qte]=line.split(/\t|;/).map(x=>(x||"").trim());
    if(!des) return;
    if(!u){ cur={numero:n,designation:des,lignes:[]}; lots.push(cur); return; }
    if(!cur){ cur={numero:String(lots.length+1),designation:"LOT",lignes:[]}; lots.push(cur); }
    const qn=parseFloat((qte||"").replace(/\s/g,"").replace(",","."));
    cur.lignes.push({numero:n,designation:des,unite:u,quantite:isNaN(qn)?null:qn});
  });
  return lots;
}

/* ===================== INTITULÉS HARMONISÉS ===================== */
/* Affichage seulement : la base garde le texte d'origine. Sigles en capitales, marques avec leur graphie, le reste en minuscules, première lettre en capitale. */
const SIGLES=new Set("pv ft fds fdes dtu pse pvc mdf acermi upec ce nf ei rei cf wc vmc led tlp lvt osb hpl ba sti stil ral ts atec dta avis".split(" "));
const MARQUES={siniat:"Siniat",placo:"Placo",placoplatre:"Placoplâtre",knauf:"Knauf",isover:"Isover",rockwool:"Rockwool",ursa:"Ursa",gerflor:"Gerflor",tarkett:"Tarkett",forbo:"Forbo",tiaso:"Tiaso",udirev:"Udirev",maestria:"Maestria",aqualine:"Aqualine",unistop:"Unistop",seigneurie:"Seigneurie",unikalo:"Unikalo",tollens:"Tollens",zolpan:"Zolpan",sikkens:"Sikkens",weber:"Weber",mapei:"Mapei",armstrong:"Armstrong",ecophon:"Ecophon",rockfon:"Rockfon",eurocoustic:"Eurocoustic",liberty:"Liberty",original:"Original",evo:"Evo",aqua:"Aqua",reguini:"Reguini",stil:"Stil"};
const MOTS_COURANTS=new Set(("fiche fiches technique techniques produit produits plaque plaques plâtre platre cloison cloisons doublage isolant isolation porte portes bloc bloc-porte peinture peintures plinthe plinthes sol sols revêtement revetement dalle dalles ossature ossatures enduit enduits joint joints bande bandes laine minérale minerale verre roche feu acoustique de du des la le les l d et en à a pour sur avec sans intérieur interieur intérieure extérieur mate satin velours vitrée vitree alu aluminium châssis chassis cadre stratifié stratifie strat résine resine ferme-porte ferme-portes notice pose certificat classement entretien données donnees sécurité securite résistance resistance réaction reaction procès-verbal proces verbal rail rails montant montants fourrure fourrures cornière corniere vis colle mortier ragréage ragreage primaire impression sous-couche finition demi environnementale sanitaire déclaration declaration performance performances haute hydro hydrofuge phonique thermique").split(" "));
function harmoniser(txt){
  const t=String(txt||"").replace(/\s+/g," ").trim(); if(!t) return t;
  const lettres=t.replace(/[^A-Za-zÀ-ÿ]/g,""), plat=lettres===lettres.toUpperCase()||lettres===lettres.toLowerCase();
  let out=t.split(/(\s+|\s-\s|\/|\(|\))/).map(m=>{
    if(!m||/^\s|^[\/()]$/.test(m)) return m;
    const k=norm(m).replace(/[^a-z0-9-]/g,""), base=m.toLowerCase();
    if(/\d/.test(m)) return m.toUpperCase().replace(/(\d)(MM|CM|M)\b/g,(x,d,u)=>d+u.toLowerCase());
    if(/^(mm|cm|m|m2|m²|m3|ml|kg|l|db)$/.test(k)) return k==="db"?"dB":base;
    if(SIGLES.has(k)) return m.toUpperCase();
    if(MARQUES[k]) return MARQUES[k];
    if(plat || MOTS_COURANTS.has(k) || MOTS_COURANTS.has(norm(m))) return base;
    return m; // nom propre déjà bien écrit, on n'y touche pas
  }).join("");
  return out.charAt(0).toUpperCase()+out.slice(1);
}
/* Noms de produits : on retire le type de document collé devant (« Fiche technique Gerflor… » → « Gerflor… ») */
function harmoniserProduit(txt){
  const h=harmoniser(txt), r=h.replace(/^(fiche technique|fiche produit|fiches techniques|ft|pv)\s*[-–:]?\s+/i,"");
  return r ? r.charAt(0).toUpperCase()+r.slice(1) : h;
}
/* Libellés de pièces : vocabulaire fixe */
function harmoniserPiece(txt){
  const h=harmoniser(txt);
  return h.replace(/^Pv\b/,"PV").replace(/^Fiche technique\b/i,"Fiche technique").replace(/^Fds\b/i,"FDS").replace(/^Fdes\b/i,"FDES");
}

async function loadEntreprise(){
  const rows=await q(sb.from("membres").select("role,nom_affiche,entreprise_id,entreprises(*)").eq("user_id",S.user.id).limit(1));
  if(rows.length){ S.ent=rows[0].entreprises; S.role=rows[0].role; S.nomAffiche=rows[0].nom_affiche||""; } else S.ent=null;
  if(S.ent) await loadMedia([S.ent.logo_path,S.ent.couverture_path]);
}
/* Images (logo, couvertures) : téléchargées une fois et gardées en data URL pour que html2canvas puisse les dessiner */
async function loadMedia(paths){
  for(const p of paths){
    if(!p || S.media[p]) continue;
    try{
      const {data,error}=await sb.storage.from("photos").download(p); if(error) throw error;
      S.media[p]=await new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=ko; r.readAsDataURL(data); });
    }catch(e){ console.warn("Image introuvable",p,e); }
  }
}
const mediaUrl = p=> p ? (S.media[p]||null) : null;
/* Réduit une photo avant envoi (les photos de téléphone font souvent 5 Mo et plus) */
async function reduireImage(file,max=1800){
  if(!/^image\/(jpeg|png|webp|heic)/i.test(file.type)) return file;
  try{
    const bmp=await createImageBitmap(file); const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(s===1 && file.size<1.5e6) return file;
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",0.86));
  }catch(e){ return file; }
}

/* ---- Infos société : utilisées par la page de garde, l'identification, les pieds de page et les attestations ---- */
function adresseSociete(e){
  const a=(e.adresse||"").trim(), cpv=[e.code_postal,e.ville].filter(Boolean).join(" ");
  if(!cpv || (e.code_postal && a.includes(e.code_postal))) return a;
  return [a,cpv].filter(Boolean).join(", ");
}
function signataireSociete(e){ return [e.signataire_nom,e.signataire_fonction].filter(Boolean).join(", "); }
function signataireChantier(c,e){ return c.signataire || signataireSociete(e) || S.nomAffiche || ""; }
function lignesSociete(e){
  const forme=[e.forme_juridique, e.capital?"au capital de "+e.capital:""].filter(Boolean).join(" ");
  const contact=[e.telephone?"Tél. "+e.telephone:"", e.email, e.site_web].filter(Boolean).join(" – ");
  const legal=[e.siret?"SIRET "+e.siret:"", e.rcs, e.ape?"APE "+e.ape:"", e.tva_intra?"TVA "+e.tva_intra:""].filter(Boolean).join(" – ");
  const assur=[e.assurance_decennale?"Garantie décennale "+e.assurance_decennale:"", e.qualifications].filter(Boolean).join(" – ");
  return {forme, adresse:adresseSociete(e), contact, legal, assur};
}
function piedSociete(e){ return [e.nom, e.forme_juridique, e.siret?"SIRET "+e.siret:""].filter(Boolean).join(" – "); }
async function loadChantiers(){ S.chantiers=await q(sb.from("chantiers").select("*").order("created_at",{ascending:false})); }
async function loadBiblio(){
  S.fourn=await q(sb.from("fournisseurs").select("*").order("nom"));
  S.produits=await q(sb.from("produits").select("*, fournisseurs(id,nom,email), pieces_requises(id,libelle,ordre, documents(id,nom_fichier,storage_path,date_validite,created_at))").order("nom"));
  S.produits.forEach(p=>{ p.pieces_requises.sort((a,b)=>a.ordre-b.ordre); p.nom=harmoniserProduit(p.nom); p.pieces_requises.forEach(r=>r.libelle=harmoniserPiece(r.libelle)); });
}
async function loadChantierData(){
  const id=S.ch.id;
  S.lots=await q(sb.from("lots").select("*, lignes_devis(*)").eq("chantier_id",id).order("ordre"));
  S.lots.forEach(l=>{ l.lignes_devis.sort((a,b)=>a.ordre-b.ordre); l.designation=harmoniser(l.designation); });
  S.rows=await q(sb.from("v_pieces_chantier").select("*").eq("chantier_id",id));
  S.rows.forEach(r=>{ r.produit_nom=harmoniserProduit(r.produit_nom); r.piece_libelle=harmoniserPiece(r.piece_libelle); });
  S.photos={};
  if(S.lots.length){
    const ph=await q(sb.from("photos").select("*").in("lot_id",S.lots.map(l=>l.id)).order("created_at"));
    if(ph.length){
      const {data}=await sb.storage.from("photos").createSignedUrls(ph.map(p=>p.storage_path),3600);
      const urls={}; (data||[]).forEach(d=>urls[d.path]=d.signedUrl);
      ph.forEach(p=>{ (S.photos[p.lot_id]=S.photos[p.lot_id]||[]).push({...p,url:urls[p.storage_path]}); });
    }
  }
}

/* Recherche rapide dans la bibliothèque : filtre sans recharger la page */
function filtrerBiblio(){
  const el=$("#rech-biblio"); if(!el) return; S.rech=el.value;
  const mots=norm(el.value).split(/\s+/).filter(Boolean); let n=0, tot=0;
  document.querySelectorAll("#liste-biblio>article").forEach(a=>{ tot++; const ok=mots.every(m=>a.dataset.rech.includes(m)); a.hidden=!ok; if(ok) n++; });
  $("#rech-nb").textContent=mots.length?`${n} / ${tot}`:"";
}

/* ---- Statistiques ---- */
function stats(){
  const p=S.rows.filter(r=>r.piece_requise_id); const c={en_bibliotheque:0,expiree:0,demandee:0,manquante:0};
  p.forEach(r=>c[r.statut]++);
  const photoLots=S.lots.filter(l=>(S.photos[l.id]||[]).length).length;
  const orphelines=lignesSansFiche().length;
  const total=p.length+S.lots.length+orphelines;
  return {...c,photoLots,orphelines,total:p.length,pct: total?Math.round((c.en_bibliotheque+photoLots)/total*100):0};
}
/* Lignes qui n'ont aucune fiche en face : pas de produit associé, ou produit sans pièce exigée */
function lignesSansFiche(){
  const byL=rowsByLigne();
  return S.lots.flatMap(l=>l.lignes_devis.filter(li=>!li.sans_fiche && (!li.produit_id || !(byL[li.id]||[]).some(r=>r.piece_requise_id))).map(li=>({...li,lot:l})));
}
function rowsByLigne(){ const m={}; S.rows.forEach(r=>{ (m[r.ligne_id]=m[r.ligne_id]||[]).push(r); }); return m; }

const nomDepuisLigne=d=>{ let t=String(d).replace(/^(option|variante)\s*\d*\s*[-–:]?\s*/i,"");
  for(let k=0;k<2;k++) t=t.replace(/^(fourniture et pose|fourniture et mise en place|f\s*\/\s*p|fourniture|pose|remplacement|cr[ée]ation|mise en place|installation|r[ée]alisation|ajout|compl[ée]ment)\s+(d['’]\s*une?\s+|d['’]\s*|de la |de l['’]|des |du |de |d['’]un |d['’]une |une? |les? |la )?/i,"").trim();
  const pc=produitCache(d); if(pc) return pc.nom;
  t=t.split(/[.,;(]/)[0].trim().replace(/\bissus de secours/i,"issue de secours"); return harmoniser(t.slice(0,60)); };
const motsDepuisLigne=d=>produitCache(d)?produitCache(d).cle:motsUtiles(nomDepuisLigne(d)).slice(0,2).join(" ");

function manquantesParFournisseur(){
  const out={}, vus=new Set();
  S.rows.forEach(r=>{ if(!r.piece_requise_id || r.statut==="en_bibliotheque") return;
    if(vus.has(r.piece_requise_id)) return; vus.add(r.piece_requise_id);
    const k=r.fournisseur_id||"aucun"; (out[k]=out[k]||{id:r.fournisseur_id,nom:r.fournisseur_nom||"Fournisseur non renseigné",pieces:[]}).pieces.push(r); });
  return Object.values(out);
}

Dans le cadre du Dossier des Ouvrages Exécutés du chantier ${c.nom}${c.adresse?" ("+c.adresse+")":""}${c.date_reception?", réception prévue le "+frDate(c.date_reception):""}, pourriez-vous nous transmettre les documents suivants :

${g.pieces.map(p=>`- ${p.produit_nom} : ${p.piece_libelle}`).join("\n")}

Merci de nous les envoyer au format PDF${c.date_reception?" avant le "+frDate(c.date_reception):" dès que possible"}.

Cordialement,
${c.signataire||S.nomAffiche||""}
${e.nom}${e.adresse?" — "+e.adresse:""}`;

/* Prestation sans produit : pas de fiche technique à fournir */
const RE_PRESTATION=/^(curage|nettoyage|d[ée]pose|d[ée]molition|d[ée]montage|tranch[ée]e|terrassement|fouille|[ée]vacuation|enl[èe]vement|location|transport|nacelle|[ée]chafaudage|main[- ]d.?[oœ]euvre|installation de chantier|repli|protection|bouchage|reprise|rebouchage|d[ée]blai|remblai|d[ée]placement|[ée]tude|relev[ée]|plans?\b|dossier|doe\b|essais?|contr[ôo]le|mise en service|raccordement|d[ée]barras|gardiennage|traitement des espaces verts|compl[ée]ment traitement|entretien|r[ée]glage|ajustement|piquetage|percement|carottage|saign[ée]e)/i;
// Produits cachés dans une ligne de prestation (ex. « Reprise peinture ou produit anti graffiti »)
const PRODUITS_CACHES=[{re:/anti[- ]?graffiti/i,nom:"Produit anti-graffiti",cle:"graffiti"}];
const produitCache=d=>PRODUITS_CACHES.find(x=>x.re.test(norm(d)));
const estPrestation=d=>!produitCache(d)&&RE_PRESTATION.test(String(d).replace(/^(option|variante)\s*\d*\s*[-–:]?\s*/i,"").trim());
function piecesPour(des){
  const d=norm(des), p=["Fiche technique"];
  if(/coupe[- ]?feu|pare[- ]?flamme|\bei\s?\d{2}|\bcf\s?\d|\bei\b|\brei\b/.test(d)) p.push("PV feu");
  if(/acousti|\bdb\b|affaibliss/.test(d)) p.push("PV acoustique");
  return p;
}
async function importDevis(){
  const lots=parseDevis($("#devis").value);
  if(!lots.length) return toast("Aucune ligne reconnue. Vérifie le format.");
  const ent=S.ent.id, ch=S.ch.id; let n=0, m=0, crees=0, presta=0; const nouveaux={};
  for(let i=0;i<lots.length;i++){
    const L=lots[i], lotSansFiche=/moins[- ]?value/i.test(L.designation);
    const [lot]=await q(sb.from("lots").insert({entreprise_id:ent,chantier_id:ch,numero:L.numero,designation:L.designation,ordre:i}).select());
    if(!L.lignes.length) continue;
    const rows=[];
    for(const [j,x] of L.lignes.entries()){
      n++; let p=null, sansFiche=false;
      if(lotSansFiche || estPrestation(x.designation)){ sansFiche=true; presta++; }
      else if(produitCache(x.designation)){ const pc=produitCache(x.designation); p=S.produits.find(y=>(y.mots_cles||[]).some(k=>norm(k)===pc.cle))||null; }
      else p=matchProduit(x.designation);
      if(sansFiche){}
      else if(!p){ // produit inconnu : créé dans la bibliothèque avec les pièces à demander
        const nom=nomDepuisLigne(x.designation), cle=norm(nom);
        p=nouveaux[cle];
        if(!p){ const [np]=await q(sb.from("produits").insert({entreprise_id:ent,nom,mots_cles:[motsDepuisLigne(x.designation)].filter(Boolean)}).select());
          await q(sb.from("pieces_requises").insert(piecesPour(x.designation).map((lib,k)=>({entreprise_id:ent,produit_id:np.id,libelle:lib,ordre:k}))));
          p=nouveaux[cle]={...np,pieces_requises:[]}; S.produits.push(p); crees++; }
      } else m++;
      rows.push({entreprise_id:ent,lot_id:lot.id,numero:x.numero,designation:x.designation,unite:x.unite,quantite:x.quantite,produit_id:p?p.id:null,sans_fiche:sansFiche,ordre:j});
    }
    await q(sb.from("lignes_devis").insert(rows));
  }
  // Infos du chantier depuis l'en-tête du PDF (seulement les champs encore vides)
  const E=S.pdfEntete||{}, c=S.ch, upd={};
  if(!c.maitre_ouvrage && E.client) upd.maitre_ouvrage=E.client;
  if(c.montant_ht==null && E.totalHT!=null) upd.montant_ht=E.totalHT;
  if(!c.designation_travaux && (E.objet||E.numero)) upd.designation_travaux=[E.objet&&norm(E.objet)!==norm(c.nom)?E.objet:"", E.numero?"Devis "+E.numero+(E.date?" du "+E.date:""):""].filter(Boolean).join(" — ");
  if(Object.keys(upd).length){ const [c2]=await q(sb.from("chantiers").update(upd).eq("id",ch).select()); if(c2) majChantierLocal(c2); }
  S.pdfEntete=null;
  toast(`${n} lignes : ${m} produits reconnus, ${crees} créés, ${presta} prestations sans fiche`);
  await loadBiblio(); await loadChantierData(); S.tab="pieces"; render();
}

/* ===================== IMPORT DU DEVIS EN PDF ===================== */
/* Lit le texte du PDF (pdf.js), reconstitue les lignes du tableau, puis remplit le cadre au format N°;Désignation;Unité;Quantité pour vérification. */
const PDFJS_URL="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function chargerPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=PDFJS_URL;
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; ok(window.pdfjsLib); }; s.onerror=()=>ko(new Error("Lecteur PDF non chargé : vérifie ta connexion.")); document.head.appendChild(s); });
}
const UNITES={"m2":"m²","m²":"m²","m":"ml","ml":"ml","ml.":"ml","mètre":"ml","m3":"m³","m³":"m³","u":"u","u.":"u","un":"u","unité":"u","unite":"u","pce":"u","pc":"u","pièce":"u","piece":"u","ens":"ens","ensemble":"ens","ft":"ft","forfait":"ft","fft":"ft","fort":"ft","h":"h","heure":"h","kg":"kg","t":"t","l":"l","jour":"j","j":"j","lot":"lot","pm":"pm"};
const estNombre=t=>/^-?\d{1,3}([  .]\d{3})*(,\d+)?$|^-?\d+([.,]\d+)?$/.test(String(t).trim());
const versNombre=t=>parseFloat(String(t).replace(/[  ]/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."));
const estNumero=t=>/^\d{1,3}(\.\d{1,3}){0,4}\.?$/.test(String(t).trim());
async function lignesPdf(file){
  const pdfjs=await chargerPdfJs(); const doc=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise; const rangs=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p), tc=await page.getTextContent(), its=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5],w:i.width}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x); const groupes=[];
    its.forEach(i=>{ const g=groupes.find(g=>Math.abs(g.y-i.y)<3); if(g) g.items.push(i); else groupes.push({y:i.y,items:[i]}); });
    groupes.forEach(g=>{ g.items.sort((a,b)=>a.x-b.x); g.page=p; rangs.push(g); });
  }
  return rangs;
}
/* Infos d'en-tête du devis : n°, date, client, objet, total HT */
function enteteDevisPdf(rangs){
  const iTab=rangs.findIndex(r=>{ const t=r.items.map(i=>i.s).join(" "); return /d[ée]signation|libell[ée]/i.test(t)&&/qt|unit|prix/i.test(t); });
  const avant=iTab>0?rangs.slice(0,iTab):rangs.filter(r=>r.page===1), tout=rangs.map(r=>r.items.map(i=>i.s).join(" "));
  const e={};
  const tx=avant.map(r=>r.items.map(i=>i.s).join(" ")).join("\n");
  const mNum=tx.match(/\b(D|DE|DEV)[- ]?\d{4}[- ]\d{1,5}\b/)||tx.match(/devis\s*n[°o]?\s*:?\s*([A-Z0-9-]{3,})/i); if(mNum) e.numero=mNum[0].replace(/^devis\s*n[°o]?\s*:?\s*/i,"");
  const mDate=tx.match(/(?:en date du|date)\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i); if(mDate) e.date=mDate[1];
  const droite=avant.filter(r=>r.page===1).flatMap(r=>{ const its=r.items.filter(i=>i.x>250), t=its.map(i=>i.s).join(" ");
    if(!its.length||/:|valable|en date|^devis\b|^n°|\d{2}\/\d{2}\/\d{4}|\bD-\d{4}/i.test(t)) return []; return [{s:t,x:its[0].x,y:r.y}]; });
  if(droite.length){ droite.sort((a,b)=>b.y-a.y); e.client=droite[0].s;
    const adr=droite.slice(1,4).map(i=>i.s).filter(t=>!/^(france|tva|t[ée]l|email)/i.test(t)); if(adr.length) e.adresseClient=adr.join(", "); }
  if(iTab>0){ for(let k=iTab-1;k>=Math.max(0,iTab-3);k--){ const r=rangs[k]; if(r.items.length===1&&r.items[0].x<200&&!/:/.test(r.items[0].s)&&!/^france$/i.test(r.items[0].s)){ e.objet=r.items[0].s; break; } } }
  const reMt=/-?\d{1,3}(?:[\s\u00a0\u202f.]\d{3})*,\d{2}/g;
  const tot=tout.filter(t=>/total\s*(net\s*)?h\.?t/i.test(t)&&!/sous/i.test(t)&&reMt.test(t)).pop(); reMt.lastIndex=0;
  if(tot){ const m=tot.match(reMt); if(m) e.totalHT=versNombre(m[m.length-1]); }
  return e;
}
function analyserDevisPdf(rangs){
  // 1. Colonnes d'après la ligne d'en-tête du tableau
  let col=null;
  for(const r of rangs){ const t=r.items.map(i=>i.s).join(" ");
    if(/d[ée]signation|libell[ée]/i.test(t) && /qt[ée]|quantit|unit|\bu\b|p\.?\s?u|prix/i.test(t)){
      const x=re=>{ const i=r.items.find(i=>re.test(i.s)); return i?i.x:null; };
      col={des:x(/d[ée]signation|libell[ée]/i), qte:x(/^(qt[ée]s?|quantit[ée]s?)(?![a-z])/i), u:x(/^(u\.?|unit[ée]s?)$/i), pu:x(/p\.?\s?u\b|prix|tva|total|montant/i)};
      break; } }
  const finDes=col?Math.min(...[col.qte,col.u,col.pu].filter(v=>v!=null).map(v=>v-4)):Infinity;
  const out=[]; let dernier=null;
  for(const r of rangs){
    const items=r.items, texte=items.map(i=>i.s).join(" ");
    if(/^(sous[- ]?total|total|montant|tva|net à payer|acompte|report|page\s+\d|conditions|pour le client)/i.test(texte)){ dernier=null; continue; }
    if(/d[ée]signation/i.test(texte) && /qt|unit|prix/i.test(texte)) continue;
    let num=null, reste=items;
    if(estNumero(items[0].s) && (!col || col.des==null || items[0].x < col.des+6) && items.length>1){ num=items[0].s.replace(/\.$/,""); reste=items.slice(1); }
    // texte de désignation et valeurs à droite
    const des=[], droite=[];
    // un nombre aligné à droite peut commencer avant l'en-tête « Qté » : on regarde où il finit
    reste.forEach(i=>{ if(col && (i.x>=finDes || (estNombre(i.s) && i.x+i.w>=finDes))) droite.push(i); else des.push(i); });
    if(!col){ // sans en-tête : les nombres et unités en fin de ligne vont à droite
      while(des.length && (estNombre(des[des.length-1].s)||UNITES[norm(des[des.length-1].s)]||/€|%/.test(des[des.length-1].s))) droite.unshift(des.pop());
    }
    let designation=des.map(i=>i.s).join(" ").replace(/\s+/g," ").trim();
    let unite="", qte=null;
    const proche=(cx)=>droite.slice().sort((a,b)=>Math.abs(a.x-cx)-Math.abs(b.x-cx))[0];
    const uItem=droite.find(i=>UNITES[norm(i.s).replace(/\s/g,"")]);
    if(uItem) unite=UNITES[norm(uItem.s).replace(/\s/g,"")];
    if(col && col.qte!=null){ const q=proche(col.qte); if(q && estNombre(q.s) && Math.abs(q.x-col.qte)<45) qte=versNombre(q.s); }
    if(qte==null){ const nums=droite.filter(i=>estNombre(i.s)); if(nums.length){ const iu=uItem?droite.indexOf(uItem):-1;
      const avant=iu>0&&estNombre(droite[iu-1].s)?droite[iu-1]:null, apres=iu>=0&&droite[iu+1]&&estNombre(droite[iu+1].s)?droite[iu+1]:null;
      qte=versNombre((avant||apres||nums[0]).s); } }
    if(num && designation && !unite && qte==null){ // titre : lot si numéro simple (« 2 »), sous-titre ignoré sinon (« 2.11 »)
      if(!num.includes(".")) out.push({type:"lot",num,des:designation}); dernier=null; continue; }
    if(num && designation){ dernier={type:"ligne",num,des:designation,unite:unite||"u",qte,y:r.y,page:r.page}; out.push(dernier); continue; }
    // suite de la désignation sur la ligne suivante : même page, juste en dessous, alignée sur la colonne désignation
    const x0=items[0].x, alignee=!col||col.des==null||Math.abs(x0-col.des)<40;
    if(!num && designation && dernier && !unite && qte==null && alignee && r.page===dernier.page && dernier.y-r.y<22 && dernier.des.length<220){ dernier.des+=" "+designation; dernier.y=r.y; }
    else if(!num) dernier=dernier&&r.page===dernier.page&&dernier.y-r.y<22?dernier:null;
  }
  return out.map(o=>o.type==="lot"?`${o.num};${o.des.replace(/;/g,",")};;`:`${o.num};${o.des.slice(0,240).replace(/;/g,",")};${o.unite};${o.qte!=null?String(o.qte).replace(".",","):""}`).join("\n");
}

/* ---- Import groupé : nom de fichier → produit + type de pièce ---- */
const MOTS_DOC = /\b(pv|feu|acoustique|fiche|fiches|technique|produit|ft|ftprod|fdes|fds|fichetechnique)\b/g;
function analyseNom(fichier){
  let n=fichier.replace(/\.pdf$/i,"").replace(/^[\d.]+\s+/,"").replace(/[+_]/g," ").replace(/\s+/g," ").trim();
  const all=n.split(/\s+-\s+/);
  const estDoc=p=>norm(p).replace(MOTS_DOC,"").replace(/[\s-]/g,"")==="";
  const docPart=norm(all.filter(estDoc).join(" "));
  const t=docPart||norm(n);
  let type="Fiche technique";
  if(/\bfdes\b|environnementale/.test(t)) type="FDES";
  else if(/\bfds\b/.test(t)) type="Fiche de données de sécurité";
  else if(/(^|[\s-])pv([\s-]|$)|proces.verbal/.test(t)) type = /acousti/.test(t) ? "PV acoustique" : /feu|\b(r|e|ei|rei)\s?\d{2,3}\b|coupe.feu|\bcf\b/.test(t) ? "PV feu" : "PV";
  else if(/fiche[\s-]produit/.test(t)) type="Fiche produit";
  let parts=all.filter(p=>!estDoc(p));
  let nom=(parts.length?parts.join(" - "):n);
  for(let i=0;i<3;i++) nom=nom.replace(/^(ftprod|fichetechnique|fiche[\s-]technique|fiche[\s-]produit|fiche|ft|pv)[\s.-]+/i,"").trim();
  nom=nom.replace(/[\s-]+(ft|pv|fiche technique)$/i,"").trim();
  if(!nom || norm(nom).replace(MOTS_DOC,"").trim()==="") nom=fichier.replace(/\.pdf$/i,"");
  return {nom, type};
}

  const files=[...input.files]; if(!files.length) return;
  const ent=S.ent.id; let ok=0, err=0;
  const log=m=>{ S.bulkLog=(S.bulkLog||"")+m+"\n"; const el=$("#bulk-log"); if(el){ el.textContent=S.bulkLog; el.scrollTop=1e9; } };
  S.bulkLog=""; render(); log(`${files.length} fichier(s) à importer…`);
  await loadBiblio();
  for(const f of files){
    try{
      if(f.size>50*1024*1024){ log(`✗ ${f.name} : trop lourd (plus de 50 Mo)`); err++; continue; }
      const {nom,type}=analyseNom(f.name);
      let p=S.produits.find(x=>norm(x.nom)===norm(nom));
      if(!p){
        const [np]=await q(sb.from("produits").insert({entreprise_id:ent,nom,mots_cles:[]}).select());
        p={...np,pieces_requises:[]}; S.produits.push(p);
      }
      let lib=type, k=2;
      while(p.pieces_requises.some(r=>norm(r.libelle)===norm(lib) && r.documents && r.documents.length)) lib=`${type} ${k++}`;
      let piece=p.pieces_requises.find(r=>norm(r.libelle)===norm(lib));
      if(!piece){
        const [npc]=await q(sb.from("pieces_requises").insert({entreprise_id:ent,produit_id:p.id,libelle:lib,ordre:p.pieces_requises.length}).select());
        piece={...npc,documents:[]}; p.pieces_requises.push(piece);
      }
      const path=`${ent}/produits/${p.id}/${Date.now()}-${safeName(f.name)}`;
      const {error}=await sb.storage.from("documents").upload(path,f,{contentType:"application/pdf"});
      if(error) throw error;
      await q(sb.from("documents").insert({entreprise_id:ent,piece_requise_id:piece.id,storage_path:path,nom_fichier:f.name,source:"upload"}));
      piece.documents.push({storage_path:path,nom_fichier:f.name,created_at:new Date().toISOString()});
      ok++; log(`✓ ${nom} — ${lib}`);
    }catch(e){ err++; log(`✗ ${f.name} : ${messageErreur(e)}`); }
  }
  log(`Terminé : ${ok} importé(s)${err?`, ${err} en erreur`:""}.`);
  await loadBiblio(); render(); toast(`${ok} document(s) importé(s)`);
}

async function supprimerProduit(){
  const id=S.delProd.id;
  const chemins=await q(sb.rpc("supprimer_produit",{p_produit:id}));
  if(chemins && chemins.length) await sb.storage.from("documents").remove(chemins);
  S.delProd=null; await loadBiblio(); render(); toast("Produit supprimé");
}
async function supprimerPiece(){
  const chemins=await q(sb.rpc("supprimer_piece",{p_piece:S.delPiece}));
  if(chemins && chemins.length) await sb.storage.from("documents").remove(chemins);
  S.delPiece=null; await loadBiblio(); render(); toast("Pièce supprimée");
}
async function seedBiblio(){
  toast("Chargement de la bibliothèque…");
  for(const x of LIB_DEPART) await creerProduit({nom:x.nom,dtu:x.dtu,four:x.f,mots:x.mots,pieces:x.pieces});
  await loadBiblio(); render(); toast("9 produits ajoutés");
}

/* ===================== ÉVÉNEMENTS ===================== */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  try{
    if(a==="home") await goHome();
    else if(a==="biblio"){ S.view="biblio"; await loadBiblio(); render(); }
    else if(a==="entreprise"){ S.view="entreprise"; S.ch=null; if(!S.chantiers.length) await loadChantiers(); render(); window.scrollTo({top:0}); }
    else if(a==="ent-img-del") await busy(b,()=>retirerImageEntreprise(b.dataset.k));
    else if(a==="ch-cov-del") await busy(b,retirerCouvertureChantier);
    else if(a==="logout"){ await sb.auth.signOut(); }
    else if(a==="authmode"){ S.authMode=S.authMode==="login"?"signup":"login"; render(); }
    else if(a==="open") await openChantier(b.dataset.id);
    else if(a==="tab"){ S.tab=b.dataset.tab; render(); window.scrollTo({top:0}); }
    else if(a==="exemple"){ $("#devis").value=EXEMPLE_DEVIS; }
    else if(a==="import") await busy(b,importDevis);
    else if(a==="replace"){ S.confirmReplace=true; render(); }
    else if(a==="replace-no"){ S.confirmReplace=false; render(); }
    else if(a==="replace-yes") await busy(b,replaceDevis);
    else if(a==="opendoc") await openDoc(b.dataset.path);
    else if(a==="copymail") await copyMail(+b.dataset.i);
    else if(a==="sent") await busy(b,()=>markSent(+b.dataset.i));
    else if(a==="seed") await busy(b,seedBiblio);
    else if(a==="del-prod"){ const {count}=await sb.from("lignes_devis").select("id",{count:"exact",head:true}).eq("produit_id",b.dataset.id); S.delProd={id:b.dataset.id,nbLignes:count||0}; render(); }
    else if(a==="del-prod-no"){ S.delProd=null; render(); }
    else if(a==="ligne-creer"){ S.creerPour=b.dataset.id; render(); const n=$("#cl-nom"); if(n) n.focus(); }
    else if(a==="ligne-creer-non"){ S.creerPour=null; render(); }
    else if(a==="ligne-fiche") await busy(b,async()=>{ await q(sb.from("lignes_devis").update({sans_fiche:b.dataset.v==="1"}).eq("id",b.dataset.id)); await loadChantierData(); render(); toast(b.dataset.v==="1"?"Ligne marquée sans fiche":"Ligne remise à traiter"); });
    else if(a==="del-piece"){ S.delPiece=b.dataset.id; S.delProd=null; render(); }
    else if(a==="del-piece-no"){ S.delPiece=null; render(); }
    else if(a==="del-piece-yes") await busy(b,supprimerPiece);
    else if(a==="del-prod-yes") await busy(b,supprimerProduit);
    else if(a==="print"){ document.body.dataset.print="doe"; window.print(); }
    else if(a==="print-att"){ document.body.dataset.print="att"; window.print(); }
    else if(a==="doe-complet") await busy(b,genererDOE);
  }catch(err){}
});
document.addEventListener("input",e=>{ if(e.target.id==="rech-biblio") filtrerBiblio(); });
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches('[role="link"][data-act]')) e.target.click(); });

document.addEventListener("change",async e=>{
  const t=e.target;
  try{
    if(t.id==="bulk-files") await importGroupe(t);
    else if(t.id==="devis-pdf") await importerPdfDevis(t);
    else if(t.matches("input[type=file][data-piece]")) await uploadDoc(t);
    else if(t.matches("input[type=file][data-lotphoto]")) await uploadPhotos(t);
    else if(t.matches("input[type=file][data-entimg]")) await imageEntreprise(t);
    else if(t.id==="ch-cov") await couvertureChantier(t);
    else if(t.matches("select[data-ligne]")){
      await q(sb.from("lignes_devis").update({produit_id:t.value||null}).eq("id",t.dataset.ligne));
      await loadChantierData(); render(); toast("Ligne mise à jour");
    }
    else if(t.matches("input[data-fournmail]")){
      await q(sb.from("fournisseurs").update({email:t.value.trim()||null}).eq("id",t.dataset.fournmail));
      await loadBiblio(); render(); toast("E-mail enregistré");
    }
  }catch(err){}
});

document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  const btn=f.querySelector("button[type=submit]");
  await busy(btn,async()=>{
    const k=f.dataset.form;
    if(k==="auth"){
      const email=$("#a-email").value.trim(), password=$("#a-pass").value;
      if(S.authMode==="signup"){
        const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
        if(error) return toast(messageErreur(error));
        if(!data.session) toast("Compte créé : clique sur le lien reçu par e-mail, puis connecte-toi.");
      } else {
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error) return toast(messageErreur(error));
      }
    }
    if(k==="onboard"){
      await q(sb.rpc("creer_entreprise",{p_nom:$("#o-nom").value.trim(),p_siret:$("#o-siret").value.trim()||null,p_adresse:$("#o-adr").value.trim()||null,p_ville:$("#o-ville").value.trim()||null}));
      const sign=$("#o-sign").value.trim();
      await loadEntreprise();
      if(sign){ await q(sb.from("membres").update({nom_affiche:sign}).eq("entreprise_id",S.ent.id).eq("user_id",S.user.id)); S.nomAffiche=sign; }
      await goHome(); toast("Entreprise créée");
    }
    if(k==="chantier"){
      const [c]=await q(sb.from("chantiers").insert({entreprise_id:S.ent.id,nom:$("#n-nom").value.trim(),adresse:$("#n-adr").value.trim()||null,
        maitre_ouvrage:$("#n-moa").value.trim()||null,maitre_oeuvre:$("#n-moe").value.trim()||null,date_reception:$("#n-date").value||null,signataire:$("#n-sign").value.trim()||null}).select());
      S.chantiers.unshift(c); await openChantier(c.id);
    }
    if(k==="infos"){
      const num=v=>{ v=String(v).replace(/\s|€|HT/gi,"").replace(",","."); return v===""?null:Number(v); };
      const upd={maitre_ouvrage:$("#i-moa").value.trim()||null,maitre_oeuvre:$("#i-moe").value.trim()||null,designation_travaux:$("#i-des").value.trim()||null,
        adresse:$("#i-adr").value.trim()||null,date_debut:$("#i-deb").value.trim()||null,date_fin:$("#i-fin").value.trim()||null,
        montant_ht:num($("#i-mt").value),date_attestation:$("#i-date").value||null,accord_cadre:$("#i-ac").value==="true",
        sous_traite:$("#i-st").value==="true",montant_st:num($("#i-mst").value),nature_st:$("#i-nst").value.trim()||null};
      if([upd.montant_ht,upd.montant_st].some(x=>x!==null&&isNaN(x))) return toast("Montant invalide : écris un nombre, par exemple 56604,84");
      const [c]=await q(sb.from("chantiers").update(upd).eq("id",S.ch.id).select());
      S.ch=c; const i=S.chantiers.findIndex(x=>x.id===c.id); if(i>=0) S.chantiers[i]=c;
      render(); toast("Informations enregistrées");
    }
    if(k==="entreprise"){
      const champs=["nom","forme_juridique","capital","siret","rcs","ape","tva_intra","qualifications","assurance_decennale","adresse","code_postal","ville","telephone","email","site_web","signataire_nom","signataire_fonction"];
      const upd={}; champs.forEach(c=>upd[c]=$("#e-"+c).value.trim()||null);
      if(!upd.nom) return toast("La raison sociale est obligatoire.");
      upd.couleur=$("#e-couleur").value;
      await majEntreprise(upd); render(); toast("Entreprise enregistrée");
    }
    if(k==="creer-ligne"){
      const ligne=f.dataset.ligne, nom=$("#cl-nom").value.trim(), lib=$("#cl-type").value, fichier=$("#cl-pdf").files[0];
      const mots=$("#cl-mots").value.split(",").map(x=>norm(x.trim())).filter(Boolean);
      const fid=await fournisseurId($("#cl-four").value);
      const [p]=await q(sb.from("produits").insert({entreprise_id:S.ent.id,nom,fournisseur_id:fid,mots_cles:mots}).select());
      const [pc]=await q(sb.from("pieces_requises").insert({entreprise_id:S.ent.id,produit_id:p.id,libelle:lib,ordre:0}).select());
      if(fichier){ const path=`${S.ent.id}/produits/${p.id}/${Date.now()}-${safeName(fichier.name)}`;
        const {error}=await sb.storage.from("documents").upload(path,fichier,{contentType:fichier.type||"application/pdf"});
        if(error) toast(messageErreur(error)); else await q(sb.from("documents").insert({entreprise_id:S.ent.id,piece_requise_id:pc.id,storage_path:path,nom_fichier:fichier.name,source:"upload"})); }
      await q(sb.from("lignes_devis").update({produit_id:p.id}).eq("id",ligne));
      S.creerPour=null; await refreshChantier(); toast(fichier?"Produit créé avec sa fiche":"Produit créé : ajoute sa fiche quand tu l'as");
    }
    if(k==="produit"){
      const split=v=>v.split(",").map(x=>x.trim()).filter(Boolean);
      await creerProduit({nom:$("#p-nom").value.trim(),dtu:$("#p-dtu").value.trim(),four:$("#p-four").value,mots:split($("#p-mots").value).map(norm),pieces:split($("#p-pieces").value)});
      await loadBiblio(); render(); toast("Produit ajouté");
    }
  });
});

/* ===================== DÉMARRAGE ===================== */
async function onSession(session){
  S.user=session?.user||null;
  if(!S.user){ S.ent=null; render(); return; }
  try{ await loadEntreprise(); if(S.ent) await goHome(); else render(); }
  catch(e){ $("#app").innerHTML=`<div class="narrow box"><h2>Connexion à la base impossible</h2><div class="err">${esc(messageErreur(e))}</div><button class="btn ghost" data-act="logout">Se déconnecter</button></div>`; }
}
let lastUid;
sb.auth.onAuthStateChange((ev,session)=>{
  const uid=session?.user?.id||null;
  if(ev==="TOKEN_REFRESHED" || (ev==="SIGNED_IN" && uid===lastUid)) return;
  lastUid=uid; onSession(session);
});
</script>
